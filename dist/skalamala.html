<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<script>
/* Skalamala – Spiel-Engine (läuft im Browser und in Node.js) */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Skalamala = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- Karten ----------
  const SUITS = ['S', 'H', 'D', 'C'];
  const SUIT_SYM = { S: '♠', H: '♥', D: '♦', C: '♣' };
  const SUIT_NAME = { S: 'Pik', H: 'Herz', D: 'Karo', C: 'Kreuz' };
  const RANK_LABEL = { 11: 'B', 12: 'D', 13: 'K', 14: 'A' };
  const isRed = (c) => c.suit === 'H' || c.suit === 'D';
  const normPos = (r) => (r >= 1 && r <= 14 ? r : ((((r - 1) % 13) + 13) % 13) + 1); // Rundherum-Positionen → 1…14
  const rankLabel = (r) => { r = normPos(r); return RANK_LABEL[r] || String(r === 1 ? 'A' : r); };
  const cardLabel = (c) => (c.joker ? 'Joker' : SUIT_SYM[c.suit] + rankLabel(c.rank));

  // Punkte: 2–9 = 5, 10–König = 10, Ass = 20, Joker = 50
  function cardPoints(c) {
    if (c.joker) return 50;
    if (c.rank === 14) return 20;
    if (c.rank >= 10) return 10;
    return 5;
  }
  const handPoints = (cards) => cards.reduce((s, c) => s + cardPoints(c), 0);

  function makeDeck() {
    // 2 Blätter à 55 Karten (52 + 3 Joker) = 110 Karten
    const deck = [];
    let id = 0;
    for (let d = 0; d < 2; d++) {
      for (const s of SUITS) for (let r = 2; r <= 14; r++) deck.push({ id: id++, suit: s, rank: r, joker: false });
      for (let j = 0; j < 3; j++) deck.push({ id: id++, suit: null, rank: 0, joker: true });
    }
    return deck;
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- Runden ----------
  // exact: beim ersten Auslegen genau so viele Karten (ohne „mind.“)
  const G = (min, exact) => ({ t: 'G', min, exact: !!exact });
  const S = (min, exact) => ({ t: 'S', min, exact: !!exact });
  const ROUNDS = [
    { n: 1, title: '1 Gruppe + 1 Sequenz', detail: 'Gruppe (3 Karten) und Sequenz (4 Karten)', slots: [G(3, 1), S(4, 1)], knock: true, fromHand: false },
    { n: 2, title: '3 Gruppen', detail: '3 Gruppen à 3 Karten', slots: [G(3, 1), G(3, 1), G(3, 1)], knock: true, fromHand: false },
    { n: 3, title: '2 Sequenzen', detail: '2 Sequenzen, mind. 4 Karten', slots: [S(4), S(4)], knock: true, fromHand: false },
    { n: 4, title: '2 Gruppen à 5', detail: '2 Gruppen à 5 Karten', slots: [G(5, 1), G(5, 1)], knock: true, fromHand: false },
    { n: 5, title: 'Skalamala', detail: '10er-Sequenz abwechselnd rot – schwarz', slots: [{ t: 'A', min: 10, exact: true }], knock: true, fromHand: false },
    { n: 6, title: '5 Gruppen à 2', detail: '5 Paare – OHNE KLOPFEN!', slots: [G(2, 1), G(2, 1), G(2, 1), G(2, 1), G(2, 1)], knock: false, fromHand: false },
    { n: 7, title: '2 Gruppen + 1 Sequenz', detail: 'aus der Hand ausmachen', slots: [G(3), G(3), S(4)], knock: true, fromHand: true },
    { n: 8, title: '1 Gruppe + 2 Sequenzen', detail: 'aus der Hand ausmachen – Finale!', slots: [G(3), S(4), S(4)], knock: true, fromHand: true },
  ];
  const TYPE_NAME = { G: 'Gruppe', S: 'Sequenz', A: 'Skalamala' };
  const slotLabel = (sl) => `${TYPE_NAME[sl.t]} (${sl.exact ? '' : 'mind. '}${sl.min})`;
  const fitsSlot = (cards, sl) => (!sl.exact || cards.length === sl.min) && !!validMeld(cards, sl.t, sl.min);

  // ---------- Kombinationen prüfen ----------
  // Ordnet eine Sequenz. alt=true: Farben abwechselnd rot/schwarz, beliebige Farben (Pik/Herz…)
  function arrangeRun(cards, alt, pref) {
    if (pref === 'wrap') return arrangeRunWrap(cards, alt);
    const jokers = cards.filter((c) => c.joker);
    const nat = cards.filter((c) => !c.joker);
    // Joker sind beliebig einsetzbar – auch eine Sequenz nur aus Jokern ist erlaubt
    if (!nat.length) return cards.length <= 14 ? cards.map((c) => ({ card: c, rank: 0 })) : null;
    if (!alt && nat.some((c) => c.suit !== nat[0].suit)) return null;
    const aces = nat.filter((c) => c.rank === 14);
    if (aces.length > 2) return null;
    const combos = 1 << aces.length;
    for (let m = combos - 1; m >= 0; m--) {
      // Bit gesetzt = Ass hoch (14), sonst niedrig (1)
      const pos = new Map();
      let ok = true;
      for (const c of nat) {
        let p = c.rank;
        if (c.rank === 14) {
          const k = aces.indexOf(c);
          p = m & (1 << k) ? 14 : 1;
        }
        if (pos.has(p)) { ok = false; break; }
        pos.set(p, c);
      }
      if (!ok) continue;
      const ps = [...pos.keys()].sort((a, b) => a - b);
      if (alt) {
        const key = (p) => ((isRed(pos.get(p)) ? 1 : 0) + p) % 2;
        const k0 = key(ps[0]);
        if (ps.some((p) => key(p) !== k0)) continue;
      }
      let lo = ps[0], hi = ps[ps.length - 1];
      const gaps = hi - lo + 1 - ps.length;
      if (gaps > jokers.length) continue;
      let extra = jokers.length - gaps;
      // übrige Joker: an das gewünschte Ende (pref 'low' = vorne), sonst hinten
      if (pref === 'low') { while (extra > 0 && lo > 1) { lo--; extra--; } }
      // Zahl = so viele übrige Joker gezielt nach vorne (vom Spieler gewählt)
      if (typeof pref === 'number') { let w = pref; while (w > 0 && extra > 0 && lo > 1) { lo--; extra--; w--; } }
      while (extra > 0 && hi < 14) { hi++; extra--; }
      while (extra > 0 && lo > 1) { lo--; extra--; }
      if (extra > 0) continue;
      const out = [];
      let ji = 0;
      for (let p = lo; p <= hi; p++) {
        if (pos.has(p)) out.push({ card: pos.get(p), rank: p });
        else out.push({ card: jokers[ji++], rank: p });
      }
      return out;
    }
    return arrangeRunWrap(cards, alt);
  }

  // Sequenz „rundherum“: König darf vor das Ass, z. B. D-K-A-2-3 (höchstens 13 Karten)
  function arrangeRunWrap(cards, alt) {
    const jokers = cards.filter((c) => c.joker);
    const nat = cards.filter((c) => !c.joker);
    if (!nat.length || cards.length > 13) return null;
    if (!alt && nat.some((c) => c.suit !== nat[0].suit)) return null;
    const r13 = (c) => (c.rank === 14 ? 1 : c.rank); // Ass = 1 … König = 13
    for (let st = 1; st <= 13; st++) {
      const pos = new Map();
      let ok = true;
      for (const c of nat) {
        const p = ((r13(c) - st + 13) % 13) + st; // st … st+12
        if (pos.has(p)) { ok = false; break; }
        pos.set(p, c);
      }
      if (!ok) continue;
      const ps = [...pos.keys()].sort((a, b) => a - b);
      if (alt) {
        const key = (p) => ((isRed(pos.get(p)) ? 1 : 0) + p) % 2;
        if (ps.some((p) => key(p) !== key(ps[0]))) continue;
      }
      let lo = ps[0], hi = ps[ps.length - 1];
      if (hi - lo + 1 > 13) continue;
      const gaps = hi - lo + 1 - ps.length;
      if (gaps > jokers.length) continue;
      let extra = jokers.length - gaps;
      while (extra > 0 && hi - lo + 1 < 13) { hi++; extra--; }
      if (extra > 0) continue;
      // nur „echte“ Rundherum-Folgen hier (lineare wurden oben schon geprüft)
      const out = [];
      let ji = 0;
      for (let p = lo; p <= hi; p++) {
        // fortlaufende Plätze (über 14 hinaus = rundherum), Anzeige über normPos
        if (pos.has(p)) out.push({ card: pos.get(p), rank: p });
        else out.push({ card: jokers[ji++], rank: p });
      }
      return out;
    }
    return null;
  }

  function validMeld(cards, t, min, pref) {
    min = min || 0;
    if (cards.length < Math.max(min, 1)) return null;
    // Immer mindestens eine echte Karte mehr als Joker (2 Karten + 1 Joker, 3 Karten + 2 Joker …)
    const nj = cards.filter((c) => c.joker).length;
    if (nj && cards.length - nj <= nj) return null;
    if (t === 'G') {
      const nat = cards.filter((c) => !c.joker);
      if (nat.some((c) => c.rank !== nat[0].rank)) return null;
      const r = nat.length ? nat[0].rank : 0; // nur Joker: Wert noch offen
      return nat.concat(cards.filter((c) => c.joker)).map((c) => ({ card: c, rank: r }));
    }
    if (t === 'S' || t === 'A') return arrangeRun(cards, t === 'A', pref);
    return null;
  }

  // Wofür können die Joker einer Sequenz stehen? Liefert die verschiedenen Möglichkeiten (je Anzahl Joker vorne)
  function runChoices(cards, t) {
    if (t !== 'S' && t !== 'A') return [];
    const nj = cards.filter((c) => c.joker).length;
    if (!nj || nj === cards.length) return [];
    const out = [], seen = new Set();
    for (let k = 0; k <= nj; k++) {
      const arr = arrangeRun(cards, t === 'A', k);
      if (!arr) continue;
      const key = arr.map((x) => x.rank).join(',');
      if (seen.has(key)) continue;
      seen.add(key);
      out.push({ pref: k, arr });
    }
    const w = arrangeRunWrap(cards, t === 'A');
    if (w && !seen.has(w.map((x) => x.rank).join(','))) out.push({ pref: 'wrap', arr: w });
    return out;
  }
  const meldPref = (a, i, mc) => (a && Array.isArray(a.jpref) && a.jpref[i] === 'wrap' ? 'wrap' : a && Array.isArray(a.jpref) && typeof a.jpref[i] === 'number' ? Math.max(0, Math.min(10, a.jpref[i] | 0)) : (mc[0].joker && !mc[mc.length - 1].joker ? 'low' : undefined));

  // Anlegen an eine Kombination. Eine einzelne Karte, die genau den Platz eines Jokers trifft,
  // ersetzt den Joker – der Joker geht zurück auf die Hand.
  const r13 = (x) => { x = normPos(x); return x === 14 ? 1 : x; };
  const sameRank = (a, b) => r13(a) === r13(b);
  // Eine Karte an ein Ende einer Sequenz legen – die vorhandenen Karten (auch Joker) behalten ihren Platz
  function extendRun(m, c, pos) {
    const n = m.cards.length, lo = m.ranks[0], hi = m.ranks[n - 1];
    const nat = m.cards.map((x, i) => ({ x, p: m.ranks[i] })).filter((o) => !o.x.joker);
    if (!nat.length) return null;
    const nj = m.cards.filter((x) => x.joker).length + (c.joker ? 1 : 0);
    if (n + 1 - nj <= nj) return null;
    const ends = pos === 'start' ? ['start', 'end'] : ['end', 'start'];
    for (const e of ends) {
      const p = e === 'start' ? lo - 1 : hi + 1;
      const nlo = Math.min(lo, p), nhi = Math.max(hi, p);
      if (nhi - nlo + 1 > 26) continue; // rundherum weiterlegen erlaubt (2 Decks: höchstens zwei volle Runden)
      if (!c.joker) {
        if (!sameRank(c.rank, p)) continue;
        if (m.t === 'S' && c.suit !== nat[0].x.suit) continue;
        if (m.t === 'A' && (isRed(c) === isRed(nat[0].x)) !== (Math.abs(p - nat[0].p) % 2 === 0)) continue;
      }
      const cardsN = e === 'start' ? [c].concat(m.cards) : m.cards.concat([c]);
      const ranksN = e === 'start' ? [p].concat(m.ranks) : m.ranks.concat([p]);
      return cardsN.map((x, i) => ({ card: x, rank: ranksN[i] }));
    }
    return null;
  }
  // Prüft eine liegende Kombination mit ihren festen Plätzen (auch lange Rundherum-Sequenzen)
  function checkMeld(m) {
    const nj = m.cards.filter((c) => c.joker).length;
    if (m.cards.length - nj <= nj) return false;
    if (m.t === 'G') return !!validMeld(m.cards, 'G');
    for (let i = 1; i < m.ranks.length; i++) if (m.ranks[i] !== m.ranks[i - 1] + 1) return false;
    const nat = m.cards.map((c, i) => ({ c, p: m.ranks[i] })).filter((o) => !o.c.joker);
    return nat.every((o) => sameRank(o.c.rank, o.p) && (m.t === 'S' ? o.c.suit === nat[0].c.suit : (isRed(o.c) === isRed(nat[0].c)) === (Math.abs(o.p - nat[0].p) % 2 === 0)));
  }
  function layOffResult(m, cards, pos) {
    if (cards.length === 1 && !cards[0].joker) {
      const c = cards[0];
      for (let i = 0; i < m.cards.length; i++) {
        if (!m.cards[i].joker) continue;
        if (m.t === 'G' ? c.rank !== m.ranks.find((r, k) => !m.cards[k].joker) : !sameRank(c.rank, m.ranks[i])) continue;
        const nc = m.cards.slice(); nc[i] = c;
        if (m.t === 'S' || m.t === 'A') {
          // Platz bleibt gleich – nur Farbe prüfen
          const ref = m.cards.map((x, k) => ({ x, p: m.ranks[k] })).find((o) => !o.x.joker);
          if (ref && m.t === 'S' && c.suit !== ref.x.suit) continue;
          if (ref && m.t === 'A' && (isRed(c) === isRed(ref.x)) !== (Math.abs(m.ranks[i] - ref.p) % 2 === 0)) continue;
          return { arr: nc.map((x, k) => ({ card: x, rank: m.ranks[k] })), joker: m.cards[i] };
        }
        const arr = validMeld(nc, m.t);
        if (arr) return { arr, joker: m.cards[i] };
      }
    }
    if ((m.t === 'S' || m.t === 'A') && cards.length === 1) {
      const arr = extendRun(m, cards[0], pos);
      return arr ? { arr, joker: null } : null;
    }
    const arr = validMeld(m.cards.concat(cards), m.t, 0, typeof pos === 'number' ? pos : pos === 'start' ? 'low' : undefined);
    return arr ? { arr, joker: null } : null;
  }

  // Ordnet Kombinationen den Vorgaben der Runde zu (Reihenfolge egal)
  function matchContract(meldCards, slots) {
    if (meldCards.length !== slots.length) return null;
    const used = new Array(slots.length).fill(false);
    const res = new Array(meldCards.length);
    function bt(i) {
      if (i === meldCards.length) return true;
      for (let k = 0; k < slots.length; k++) {
        if (used[k]) continue;
        if (fitsSlot(meldCards[i], slots[k])) {
          used[k] = true; res[i] = slots[k].t;
          if (bt(i + 1)) return true;
          used[k] = false;
        }
      }
      return false;
    }
    return bt(0) ? res : null;
  }

  // ---------- Spielzustand ----------
  function newGame(players, opts) {
    const s = {
      players: players.map((p) => ({ name: p.name, bot: !!p.bot, hand: [], down: false, scores: [], total: 0 })),
      round: -1,
      dealer: Math.floor(Math.random() * players.length),
      phase: 'init',
      current: 0,
      stock: [], discard: [], discardBy: null,
      melds: [], meldSeq: 0,
      knock: null,
      log: [], seq: 0,
      lastRound: null,
      opts: Object.assign({ knockMs: 7000 }, opts || {}),
      started: Date.now(),
    };
    startRound(s);
    return s;
  }

  function log(s, msg) {
    s.log.push({ t: Date.now(), msg });
    if (s.log.length > 80) s.log.splice(0, s.log.length - 80);
  }

  function startRound(s) {
    s.mustPlay = [];
    s.round++;
    if (s.round > 0) s.dealer = (s.dealer + 1) % s.players.length;
    const deck = shuffle(makeDeck());
    s.players.forEach((p) => { p.hand = []; p.down = false; p.downTurn = -1; });
    const n = s.players.length;
    for (let k = 0; k < 11; k++) for (let i = 1; i <= n; i++) s.players[(s.dealer + i) % n].hand.push(deck.pop());
    s.stock = deck;
    s.discard = [s.stock.pop()];
    s.discardBy = null;
    s.reshuffles = 0;
    s.turn = 0;
    s.turnAt = Date.now();
    s.taken = {};
    s.melds = [];
    s.current = (s.dealer + 1) % n;
    s.phase = 'draw';
    s.knock = { responses: {}, deadline: 0, order: [] };
    s.lastRound = null;
    log(s, `Runde ${s.round + 1}: ${ROUNDS[s.round].title} – ${s.players[s.dealer].name} gibt, ${s.players[s.current].name} beginnt.`);
    s.seq++;
  }

  function drawFromStock(s) {
    if (!s.stock.length) {
      // Der Stapel wird höchstens einmal pro Runde neu gemischt
      if (s.discard.length <= 1 || s.reshuffles >= 1) return null;
      s.reshuffles++;
      const top = s.discard.pop();
      s.stock = shuffle(s.discard);
      s.discard = [top];
      log(s, 'Der Stapel ist leer – die Ablage wird neu gemischt (letztes Mal in dieser Runde).');
    }
    return s.stock.pop() || null;
  }
  const available = (s) => s.stock.length + (s.reshuffles ? 0 : Math.max(0, s.discard.length - 1));

  // Darf seat jetzt klopfen?
  function canKnock(s, seat) {
    if (seat == null || seat === s.current) return false;
    if (s.phase !== 'draw' && s.phase !== 'knock') return false;
    if (!ROUNDS[s.round].knock) return false;
    if (s.knock && s.knock.rejected) return false;
    const p = s.players[seat];
    if (!p || p.down) return false;
    if (!s.discard.length || seat === s.discardBy) return false;
    if (available(s) < 2) return false;
    return true;
  }
  const knockEligible = (s) => s.players.map((_, i) => i).filter((i) => canKnock(s, i));
  function knockOrder(s) {
    const n = s.players.length, out = [];
    for (let k = 1; k < n; k++) out.push((s.current + k) % n);
    return out;
  }
  function knockPending(s) {
    return knockEligible(s).filter((i) => s.knock.responses[i] === undefined);
  }
  // Wer zuerst klopft, bekommt die Karte (der Spieler am Zug hat aber immer Vorrang).
  // Entschieden ist es, sobald jemand geklopft hat oder alle gepasst haben.
  function firstKnocker(s) {
    const elig = new Set(knockEligible(s));
    return (s.knock.order || []).find((i) => elig.has(i));
  }
  function knockDecided(s) {
    if (firstKnocker(s) !== undefined) return true;
    return knockPending(s).length === 0;
  }

  // Merkt, welche Karten ein Spieler zuletzt bekommen hat (für die NEU-Markierung)
  function gave(s, seat, ids) {
    s.got = s.got || {}; s.gotSeq = s.gotSeq || {};
    s.got[seat] = ids.slice(); s.gotSeq[seat] = (s.gotSeq[seat] || 0) + 1;
  }
  function resolveKnock(s) {
    const winner = firstKnocker(s);
    if (winner !== undefined) {
      const p = s.players[winner];
      const c = s.discard.pop();
      p.hand.push(c);
      const pen = drawFromStock(s);
      if (pen) p.hand.push(pen);
      gave(s, winner, pen ? [c.id, pen.id] : [c.id]);
      log(s, `👊 ${p.name} klopft und nimmt ${cardLabel(c)} + 1 verdeckte Karte.`);
    }
    const c = drawFromStock(s);
    s.knock = { responses: {}, deadline: 0, order: [] };
    if (!c) return endRound(s, null);
    s.players[s.current].hand.push(c);
    gave(s, s.current, [c.id]);
    s.phase = 'play';
    s.lastDrawn = c.id;
    log(s, `${s.players[s.current].name} zieht vom Stapel.`);
  }

  // Jemand macht aus: Wer noch nicht ausgelegt hat, darf jetzt noch genau die Vorgabe auslegen (nichts anlegen)
  function endRound(s, winner) {
    if (winner != null) {
      // Wer die Vorgabe noch auf der Hand hat, legt sie automatisch aus – für alle sichtbar, kurz vor der Abrechnung
      const late = [];
      for (let i = 0; i < s.players.length; i++) {
        const p = s.players[i];
        if (i === winner || p.down || !p.hand.length) continue;
        const a = botLastLay(s, i);
        if (a.type === 'layDown' && lateLay(s, i, a.melds)) late.push(i);
      }
      if (late.length) {
        log(s, `🎉 ${s.players[winner].name} macht aus!`);
        s.phase = 'lastLay';
        s.lastLay = { winner, pending: [], late, deadline: Date.now() + (s.opts.lastLayMs || 4500) };
        return;
      }
    }
    finishRound(s, winner);
  }
  // Nach dem Ausmachen eines anderen: genau die Vorgabe noch auslegen (nichts anlegen)
  function lateLay(s, seat, melds) {
    const R = ROUNDS[s.round], p = s.players[seat];
    if (!Array.isArray(melds) || melds.length !== R.slots.length) return false;
    const cards = takeFromHand(p, [].concat(...melds));
    if (!cards) return false;
    const meldCards = melds.map((ids) => ids.map((id) => cards.find((c) => c.id === id)));
    const types = matchContract(meldCards, R.slots);
    if (!types) return false;
    removeFromHand(p, cards);
    meldCards.forEach((mc, i) => {
      const arr = validMeld(mc, types[i], 0, meldPref(null, i, mc));
      s.melds.push({ id: ++s.meldSeq, owner: seat, t: types[i], cards: arr.map((x) => x.card), ranks: arr.map((x) => x.rank), late: true });
    });
    p.down = true;
    log(s, `✋ ${p.name} legt noch die Vorgabe aus: ${types.map((t) => TYPE_NAME[t]).join(', ')}.`);
    return true;
  }
  function finishRound(s, winner) {
    const late = s.lastLay ? s.lastLay.late || [] : [];
    s.lastLay = null;
    const pts = s.players.map((p, i) => (i === winner ? 0 : handPoints(p.hand)));
    s.players.forEach((p, i) => { p.scores.push(pts[i]); p.total += pts[i]; });
    s.lastRound = {
      round: s.round, winner,
      points: pts,
      late,
      hands: s.players.map((p) => p.hand.slice()),
    };
    if (winner != null) log(s, `🎉 ${s.players[winner].name} hat die Runde gewonnen!`);
    else log(s, 'Der Stapel ist aufgebraucht – Runde beendet, alle zählen ihre Handkarten.');
    s.phase = s.round >= ROUNDS.length - 1 ? 'gameEnd' : 'roundEnd';
    if (s.phase === 'gameEnd') s.ended = Date.now();
  }

  function nextTurn(s) {
    s.mustPlay = [];
    s.current = (s.current + 1) % s.players.length;
    s.turn = (s.turn || 0) + 1;
    s.turnAt = Date.now();
    s.phase = 'draw';
    s.knock = { responses: {}, deadline: 0, order: [] };
    s.lastDrawn = null;
    s.lastTaken = null;
  }

  function takeFromHand(p, ids) {
    const cards = [];
    for (const id of ids) {
      const c = p.hand.find((h) => h.id === id);
      if (!c || cards.includes(c)) return null;
      cards.push(c);
    }
    return cards;
  }
  const removeFromHand = (p, cards) => { p.hand = p.hand.filter((c) => !cards.includes(c)); };

  // ---------- Aktionen ----------
  // gibt null (ok) oder eine Fehlermeldung zurück
  function act(s, seat, a) {
    const r = _act(s, seat, a);
    if (!r) s.seq++;
    return r;
  }
  function _act(s, seat, a) {
    if (!a || !a.type) return 'Ungültige Aktion';
    const R = ROUNDS[s.round];
    const p = seat != null ? s.players[seat] : null;

    if (a.type === 'nextRound') {
      if (s.phase !== 'roundEnd') return 'Runde läuft noch';
      startRound(s);
      return null;
    }
    if (s.phase === 'lastLay') {
      const L = s.lastLay;
      if (a.type === 'lastLayTimeout') { L.pending = []; finishRound(s, L.winner); return null; }
      if (seat == null || !L.pending.includes(seat)) return 'Die Runde ist vorbei – du darfst nichts mehr auslegen.';
      if (a.type === 'lastPass') {
        L.pending = L.pending.filter((i) => i !== seat);
        log(s, `${p.name} legt nichts mehr aus.`);
      } else if (a.type === 'layDown') {
        if (!Array.isArray(a.melds) || a.melds.length !== R.slots.length) return `Nur genau die Vorgabe auslegen: ${R.slots.map(slotLabel).join(' + ')}.`;
        const cards = takeFromHand(p, [].concat(...a.melds));
        if (!cards) return 'Karten nicht auf der Hand';
        const meldCards = a.melds.map((ids) => ids.map((id) => cards.find((c) => c.id === id)));
        const types = matchContract(meldCards, R.slots);
        if (!types) return `Nur genau die Vorgabe auslegen: ${R.slots.map(slotLabel).join(' + ')}.`;
        removeFromHand(p, cards);
        meldCards.forEach((mc, i) => {
          const arr = validMeld(mc, types[i], 0, meldPref(a, i, mc)) || validMeld(mc, types[i], 0);
          s.melds.push({ id: ++s.meldSeq, owner: seat, t: types[i], cards: arr.map((x) => x.card), ranks: arr.map((x) => x.rank) });
        });
        p.down = true;
        L.pending = L.pending.filter((i) => i !== seat);
        log(s, `${p.name} legt noch schnell aus: ${types.map((t) => TYPE_NAME[t]).join(', ')}.`);
      } else return 'Jetzt darfst du nur noch die Vorgabe auslegen oder passen.';
      if (!L.pending.length) finishRound(s, L.winner);
      return null;
    }
    if (a.type === 'knockTimeout') {
      if (s.phase !== 'knock') return 'Kein Klopfen offen';
      for (const i of knockPending(s)) s.knock.responses[i] = 'pass';
      resolveKnock(s);
      return null;
    }
    if (a.type === 'knock' || a.type === 'pass') {
      if (seat == null || !p) return 'Ungültiger Spieler';
      if (a.type === 'knock' && !canKnock(s, seat)) return 'Klopfen ist gerade nicht möglich';
      if (a.type === 'pass' && (s.phase !== 'draw' && s.phase !== 'knock')) return 'Nichts zu passen';
      if (s.knock.responses[seat] !== undefined) return 'Du hast schon entschieden';
      s.knock.responses[seat] = a.type;
      if (a.type === 'knock') {
        s.knock.order = s.knock.order || [];
        s.knock.order.push(seat);
        // Spieler am Zug muss zustimmen (👍), ablehnen (👎) oder selbst nehmen – ohne Antwort wird automatisch zugestimmt
        if (s.knock.order.length === 1) {
          const curAuto = s.autoSeats ? s.autoSeats[s.current] : s.players[s.current].bot;
          // Klopfen während des Klopf-Fensters: ein Mensch am Zug wird trotzdem gefragt (👍/👎)
          if (s.phase === 'knock' && !curAuto) s.phase = 'draw';
          // Entscheidung (👍/👎) bleibt stehen, bis der Spieler am Zug antwortet – online nur mit großzügigem Sicherheits-Zeitlimit
          if (s.phase === 'draw') s.knock.approveDeadline = s.opts.approveMs ? Date.now() + s.opts.approveMs : 0;
        }
        log(s, s.knock.order.length === 1 ? `👊 ${p.name} klopft als Erste(r)!` : `👊 ${p.name} klopft – zu spät.`);
      }
      if (s.phase === 'knock' && knockDecided(s)) resolveKnock(s);
      return null;
    }

    if (seat !== s.current) return 'Du bist nicht dran';

    if (s.phase === 'draw') {
      if (a.type === 'takeDiscard') {
        if (!s.discard.length) return 'Die Ablage ist leer';
        const c = s.discard.pop();
        p.hand.push(c);
        gave(s, seat, [c.id]);
        s.lastDrawn = c.id;
        s.lastTaken = c.id;
        s.taken[c.id] = (s.taken[c.id] || 0) + 1;
        s.knock = { responses: {}, deadline: 0, order: [] };
        s.phase = 'play';
        log(s, `${p.name} nimmt ${cardLabel(c)} von der Ablage.`);
        return null;
      }
      if (a.type === 'rejectKnock') {
        if (!(s.knock.order || []).length) return 'Niemand hat geklopft';
        // 👎 abgelehnt: der Spieler am Zug nimmt die offene Karte selbst – ohne Strafkarte
        log(s, `👎 ${p.name} lehnt das Klopfen ab und nimmt die Karte selbst.`);
        s.knock = { responses: {}, deadline: 0, order: [], rejected: true };
        return act(s, seat, { type: 'takeDiscard' });
      }
      if (a.type === 'drawStock') {
        if (R.knock && !s.knock.rejected && knockEligible(s).length) {
          s.phase = 'knock';
          s.knock.deadline = Date.now() + s.opts.knockMs;
          if (knockDecided(s)) resolveKnock(s);
          return null;
        }
        const c = drawFromStock(s);
        if (!c) { endRound(s, null); return null; }
        p.hand.push(c);
        gave(s, seat, [c.id]);
        s.lastDrawn = c.id;
        s.phase = 'play';
        log(s, `${p.name} zieht vom Stapel.`);
        return null;
      }
      return 'Zuerst eine Karte ziehen';
    }

    if (s.phase !== 'play') return 'Gerade nicht möglich';

    if (a.type === 'layDown') {
      if (p.down) return 'Du hast schon ausgelegt';
      if (!Array.isArray(a.melds)) return 'Ungültig';
      if (a.melds.length !== R.slots.length) return `In dieser Runde werden genau ${R.slots.length} Kombination${R.slots.length === 1 ? '' : 'en'} ausgelegt: ${R.slots.map(slotLabel).join(' + ')}. Weitere Karten danach anlegen.`;
      const all = [].concat(...a.melds);
      const cards = takeFromHand(p, all);
      if (!cards) return 'Karten nicht auf der Hand';
      const meldCards = a.melds.map((ids) => ids.map((id) => cards.find((c) => c.id === id)));
      const types = matchContract(meldCards, R.slots);
      if (!types) return `Beim Auslegen genau die Vorgabe: ${R.slots.map(slotLabel).join(' + ')}. Anlegen erst ab deinem nächsten Zug.`;
      const left = p.hand.length - cards.length;
      if (R.fromHand && left > 1) return 'In dieser Runde muss komplett aus der Hand ausgemacht werden (höchstens 1 Karte zum Abwerfen übrig).';
      removeFromHand(p, cards);
      meldCards.forEach((mc, i) => {
        const arr = validMeld(mc, types[i], 0, meldPref(a, i, mc)) || validMeld(mc, types[i], 0);
        s.melds.push({ id: ++s.meldSeq, owner: seat, t: types[i], cards: arr.map((x) => x.card), ranks: arr.map((x) => x.rank) });
      });
      p.down = true;
      p.downTurn = s.turn;
      log(s, `${p.name} legt aus: ${types.map((t) => TYPE_NAME[t]).join(', ')}.`);
      if (R.fromHand) {
        if (p.hand.length === 1) {
          const c = p.hand.pop();
          s.discard.push(c); s.discardBy = seat;
          log(s, `${p.name} wirft ${cardLabel(c)} ab.`);
        }
        endRound(s, seat);
        return null;
      }
      if (!p.hand.length) endRound(s, seat);
      return null;
    }

    if (a.type === 'layOff') {
      if (!p.down) return 'Erst die Vorgabe auslegen, dann anlegen';
      const m = s.melds.find((x) => x.id === a.meldId);
      if (!m) return 'Kombination nicht gefunden';
      if (p.downTurn === s.turn) return 'Im Zug des Auslegens wird nur die Vorgabe ausgelegt – anlegen (bei dir und den Gegenspielern) erst ab deinem nächsten Zug.';
      const ids = a.cardIds || (a.cardId != null ? [a.cardId] : []);
      const cards = takeFromHand(p, ids);
      if (!cards || !cards.length) return 'Karten nicht auf der Hand';
      const res = layOffResult(m, cards, a.pos);
      if (!res) {
        const nj = m.cards.concat(cards).filter((c) => c.joker).length;
        if (nj && m.cards.length + cards.length - nj <= nj) return 'Zu viele Joker: In jeder Kombination muss mindestens eine echte Karte mehr liegen als Joker.';
        return 'Passt nicht an diese Kombination';
      }
      removeFromHand(p, cards);
      m.cards = res.arr.map((x) => x.card);
      m.ranks = res.arr.map((x) => x.rank);
      s.mustPlay = (s.mustPlay || []).filter((id) => !cards.some((c) => c.id === id));
      if (res.joker) {
        p.hand.push(res.joker);
        gave(s, seat, [res.joker.id]);
        s.lastDrawn = res.joker.id;
        s.mustPlay.push(res.joker.id);
        log(s, `🔄 ${p.name} tauscht ${cardLabel(cards[0])} gegen den Joker – der Joker muss in diesem Zug wieder angelegt werden.`);
        return null;
      }
      log(s, `${p.name} legt ${cards.map(cardLabel).join(' ')} an.`);
      if (!p.hand.length) endRound(s, seat);
      return null;
    }

    if (a.type === 'discard') {
      const c = p.hand.find((h) => h.id === a.cardId);
      if (!c) return 'Karte nicht auf der Hand';
      const owed = p.hand.filter((h) => (s.mustPlay || []).includes(h.id));
      if (owed.length && owed.some((j) => canLayOffAny(s, j, seat))) return 'Den eingetauschten Joker musst du erst wieder anlegen – an eine beliebige Kombination.';
      removeFromHand(p, [c]);
      s.discard.push(c);
      s.discardBy = seat;
      log(s, `${p.name} wirft ${cardLabel(c)} ab.`);
      if (!p.hand.length) { endRound(s, seat); return null; }
      nextTurn(s);
      return null;
    }
    return 'Unbekannte Aktion';
  }

  // Sicht eines Spielers (versteckt fremde Karten)
  function view(s, seat) {
    const reveal = s.phase === 'roundEnd' || s.phase === 'gameEnd';
    return {
      seat,
      round: s.round,
      roundInfo: ROUNDS[s.round],
      phase: s.phase,
      current: s.current,
      dealer: s.dealer,
      players: s.players.map((p) => ({ name: p.name, bot: p.bot, down: p.down, handCount: p.hand.length, total: p.total, scores: p.scores.slice() })),
      hand: seat != null && s.players[seat] ? s.players[seat].hand.slice() : [],
      melds: s.melds.map((m) => ({ id: m.id, owner: m.owner, t: m.t, cards: m.cards.slice(), ranks: m.ranks.slice(), late: !!m.late })),
      discardTop: s.discard.length ? s.discard[s.discard.length - 1] : null,
      discardCount: s.discard.length,
      discardBy: s.discardBy,
      stockCount: s.stock.length,
      reshuffles: s.reshuffles,
      lastDrawn: seat === s.current ? s.lastDrawn : null,
      mustPlay: seat === s.current ? (s.mustPlay || []).slice() : [],
      got: seat != null && s.got && s.got[seat] ? s.got[seat].slice() : [],
      gotSeq: seat != null && s.gotSeq ? s.gotSeq[seat] || 0 : 0,
      clock: { game: (s.ended || Date.now()) - (s.started || Date.now()), turn: Date.now() - (s.turnAt || Date.now()) },
      ownLocked: seat != null && s.players[seat] ? (s.players[seat].down && s.players[seat].downTurn === s.turn) : false,
      knock: {
        responses: Object.assign({}, s.knock.responses),
        first: firstKnocker(s),
        approveDeadline: s.knock.approveDeadline || 0,
        deadline: s.knock.deadline,
        canKnock: canKnock(s, seat),
        pending: s.phase === 'knock' ? knockPending(s) : [],
      },
      lastLay: s.phase === 'lastLay' && s.lastLay ? { winner: s.lastLay.winner, pending: s.lastLay.pending.slice(), late: (s.lastLay.late || []).slice(), deadline: s.lastLay.deadline } : null,
      log: s.log.slice(-25),
      // Am Rundenende nur Punkte zeigen – fremde Karten bleiben verdeckt, nur die eigenen Restkarten sind sichtbar
      lastRound: reveal && s.lastRound ? {
        round: s.lastRound.round, winner: s.lastRound.winner, points: s.lastRound.points.slice(),
        hands: s.lastRound.hands.map((h, i) => (i === seat ? h.slice() : [])),
        counts: s.lastRound.hands.map((h) => h.length),
        late: (s.lastRound.late || []).slice(),
      } : null,
      seq: s.seq,
    };
  }

  // ---------- Bot ----------
  function dist(a, b) {
    // Abstand zweier Ränge, Ass zählt als 1 oder 14
    const ra = a === 14 ? [1, 14] : [a], rb = b === 14 ? [1, 14] : [b];
    let d = 99;
    for (const x of ra) for (const y of rb) d = Math.min(d, Math.abs(x - y));
    return d;
  }
  function usefulness(c, others, R) {
    if (c.joker) return 100;
    const types = new Set(R.slots.map((x) => x.t));
    let u = 0;
    if (types.has('G')) {
      const same = others.filter((o) => !o.joker && o.rank === c.rank).length;
      const pairs = R.slots.every((x) => x.min === 2);
      if (same) u += pairs ? 7 : same === 1 ? 3.5 : 5 + same;
    }
    if (types.has('S')) {
      const seen = new Set();
      for (const o of others) {
        if (o.joker || o.suit !== c.suit || seen.has(o.rank)) continue;
        const d = dist(c.rank, o.rank);
        if (d >= 1 && d <= 3) { u += 4 - d; seen.add(o.rank); }
      }
    }
    if (types.has('A')) {
      const seen = new Set();
      for (const o of others) {
        if (o.joker || seen.has(o.rank)) continue;
        const d = dist(c.rank, o.rank);
        if (d >= 1 && d <= 4 && (isRed(c) !== isRed(o)) === (d % 2 === 1)) { u += (5 - d) * 0.8; seen.add(o.rank); }
      }
    }
    return u;
  }

  function candidates(cards, slot) {
    const jokers = cards.filter((c) => c.joker);
    const nat = cards.filter((c) => !c.joker);
    const out = [];
    if (slot.t === 'G') {
      const by = {};
      for (const c of nat) (by[c.rank] = by[c.rank] || []).push(c);
      for (const r in by) {
        const arr = by[r];
        const t = Math.min(arr.length, slot.min);
        const need = slot.min - t;
        if (need <= jokers.length && t > need) out.push({ cards: arr.slice(0, t).concat(jokers.slice(0, need)), cost: need, val: +r });
      }
    } else {
      const span = slot.min;
      const variants = slot.t === 'S' ? SUITS.map((su) => ({ su })) : [{ par: 0 }, { par: 1 }];
      for (const v of variants) {
        for (let lo = 1; lo + span - 1 <= 14; lo++) {
          const chosen = [];
          let missing = 0;
          for (let p = lo; p < lo + span; p++) {
            const rk = p === 1 ? 14 : p;
            const c = nat.find((x) => x.rank === rk && !chosen.includes(x) &&
              (slot.t === 'S' ? x.suit === v.su : (isRed(x) ? 1 : 0) === (p + v.par) % 2));
            if (c) chosen.push(c); else missing++;
          }
          if (missing <= jokers.length && chosen.length > missing) out.push({ cards: chosen.concat(jokers.slice(0, missing)), cost: missing, val: lo });
        }
      }
    }
    out.sort((a, b) => a.cost - b.cost || b.val - a.val);
    return out.slice(0, 30);
  }

  // Sucht eine Auslage für die Vorgabe. extend=true: Restkarten werden noch angelegt.
  function findContract(hand, R, extend, maxNodes) {
    maxNodes = maxNodes || 4000;
    const order = R.slots.map((sl, i) => ({ sl, i })).sort((a, b) => {
      const w = (x) => (x.sl.t === 'A' ? 0 : x.sl.t === 'S' ? 1 : 2);
      return w(a) - w(b) || b.sl.min - a.sl.min;
    });
    let best = null, nodes = 0;
    function finish(acc, rem) {
      let melds = acc.map((m) => ({ t: m.t, cards: m.cards.slice() }));
      let left = rem.slice();
      if (extend) {
        let changed = true;
        while (changed) {
          changed = false;
          for (const c of left.slice()) {
            for (const m of melds) {
              if (validMeld(m.cards.concat([c]), m.t)) { m.cards.push(c); left = left.filter((x) => x !== c); changed = true; break; }
            }
          }
        }
      }
      const score = left.length * 1000 + handPoints(left);
      if (!best || score < best.score) best = { score, melds, left };
    }
    function bt(k, rem, acc) {
      if (++nodes > maxNodes) return;
      if (best && !extend) return;
      if (best && best.left.length === 0) return;
      if (k === order.length) return finish(acc, rem);
      const sl = order[k].sl;
      for (const cand of candidates(rem, sl)) {
        bt(k + 1, rem.filter((c) => !cand.cards.includes(c)), acc.concat([{ t: sl.t, cards: cand.cards }]));
        if (nodes > maxNodes) return;
      }
    }
    bt(0, hand.slice(), []);
    return best;
  }

  // Wie weit ist die Hand von der Vorgabe entfernt? (kleiner = besser)
  const VJ = [0, 1, 2, 3].map((k) => ({ id: -100 - k, suit: null, rank: 0, joker: true, virtual: true }));
  function progress(hand, R) {
    for (let k = 0; k <= 3; k++) {
      const f = findContract(hand.concat(VJ.slice(0, k)), R, true, 1200);
      if (f) {
        const left = f.left.filter((c) => !c.virtual);
        return k * 20 + left.length * 3 + handPoints(left) / 60;
      }
    }
    return 80 - Math.min(10, hand.reduce((t, c) => t + usefulness(c, hand.filter((x) => x !== c), R), 0) / 10);
  }
  function bestDiscard(hand, R, lastDrawn, avoid) {
    let best = null, bestScore = Infinity;
    for (const c of hand) {
      if (c.id === avoid && hand.length > 1) continue;
      if (c.joker && hand.some((x) => !x.joker)) continue;
      const sc = progress(hand.filter((x) => x !== c), R) - cardPoints(c) / 200 + (c.id === lastDrawn ? 0.01 : 0);
      if (sc < bestScore) { bestScore = sc; best = c; }
    }
    return { card: best || hand[0], score: bestScore };
  }

  function canLayOffAny(s, c, seat) {
    const p = seat != null ? s.players[seat] : null;
    const locked = p && p.downTurn === s.turn;
    return !locked && s.melds.find((m) => layOffResult(m, [c]));
  }

  // Nach dem Ausmachen eines anderen: Vorgabe noch auslegen, wenn möglich
  function botLastLay(s, i) {
    const R = ROUNDS[s.round];
    const f = findContract(s.players[i].hand, R, false);
    return f && f.melds && f.melds.length === R.slots.length ? { type: 'layDown', melds: f.melds.map((m) => m.cards.map((c) => c.id)) } : { type: 'lastPass' };
  }

  // Will der Bot um die offene Karte klopfen?
  function botWantsKnock(s, seat) {
    const R = ROUNDS[s.round];
    const p = s.players[seat];
      const c = s.discard[s.discard.length - 1];
      let want = false;
      // In "aus der Hand"-Runden macht jede Strafkarte das Ausmachen schwerer
      const maxHand = R.fromHand ? 11 : 13;
      if (c && !p.down && p.hand.length <= maxHand) {
        if (c.joker) want = true;
        else if (R.fromHand) {
          const f = findContract(p.hand.concat([c]), R, true);
          want = !!(f && f.left.length <= 2);
        } else {
          const u = usefulness(c, p.hand, R);
          if (u >= 6) want = true;
        }
      }
      return want;
  }

  function botAction(s, seat) {
    const R = ROUNDS[s.round];
    const p = s.players[seat];
    if (s.phase === 'knock') {
      if (!knockPending(s).includes(seat)) return null;
      return { type: botWantsKnock(s, seat) ? 'knock' : 'pass' };
    }
    if (seat !== s.current) return null;
    if (s.phase === 'draw') {
      const c = s.discard[s.discard.length - 1];
      if (!c) return { type: 'drawStock' };
      if ((s.taken[c.id] || 0) >= 2) return { type: 'drawStock' };
      if (c.joker) return { type: 'takeDiscard' };
      if (p.down) return canLayOffAny(s, c, seat) ? { type: 'takeDiscard' } : { type: 'drawStock' };
      const before = findContract(p.hand, R, R.fromHand);
      const okBefore = before && (!R.fromHand || before.left.length <= 1);
      if (!okBefore) {
        const after = findContract(p.hand.concat([c]), R, R.fromHand);
        if (after && (!R.fromHand || after.left.length <= 1)) return { type: 'takeDiscard' };
      }
      if (R.fromHand || R.slots[0].t === 'A') {
        const now = progress(p.hand, R);
        const withC = bestDiscard(p.hand.concat([c]), R).score;
        return withC < now - 0.5 ? { type: 'takeDiscard' } : { type: 'drawStock' };
      }
      const uNew = usefulness(c, p.hand, R);
      const minU = Math.min(...p.hand.map((h) => usefulness(h, p.hand.filter((x) => x !== h), R)));
      if (uNew >= 3 && uNew > minU + 1) return { type: 'takeDiscard' };
      return { type: 'drawStock' };
    }
    if (s.phase === 'play') {
      if (!p.down) {
        const f = findContract(p.hand, R, R.fromHand);
        if (f && (!R.fromHand || f.left.length <= 1)) return { type: 'layDown', melds: f.melds.map((m) => m.cards.map((c) => c.id)) };
      } else {
        const owedFirst = p.hand.slice().sort((a, b) => ((s.mustPlay || []).includes(b.id) ? 1 : 0) - ((s.mustPlay || []).includes(a.id) ? 1 : 0));
        for (const c of owedFirst) {
          const m = canLayOffAny(s, c, seat);
          if (m) return { type: 'layOff', cardIds: [c.id], meldId: m.id };
        }
      }
      // Abwerfen
      if (!p.down && (R.fromHand || R.slots[0].t === 'A')) return { type: 'discard', cardId: bestDiscard(p.hand, R, s.lastDrawn, s.lastTaken).card.id };
      let best = null, bestKey = Infinity;
      for (const c of p.hand) {
        if (c.joker && p.hand.some((x) => !x.joker)) continue;
        if (c.id === s.lastTaken && p.hand.length > 1) continue;
        const key = p.down ? -cardPoints(c) : usefulness(c, p.hand.filter((x) => x !== c), R) - cardPoints(c) / 25 + (c.id === s.lastDrawn ? 0.5 : 0);
        if (key < bestKey) { bestKey = key; best = c; }
      }
      return { type: 'discard', cardId: (best || p.hand[0]).id };
    }
    return null;
  }

  // ---------- Tipp-Modus: Vorschlag für den eigenen Zug (aus der Spielersicht berechnet) ----------
  function suggest(v) {
    const seat = v.seat, R = v.roundInfo;
    if (seat == null || !v.players[seat]) return null;
    const players = v.players.map((p, i) => ({ name: p.name, hand: i === seat ? v.hand.slice() : [], down: p.down, downTurn: i === seat && v.ownLocked ? 0 : -1 }));
    const s = {
      round: v.round, phase: v.phase, current: v.current, players, turn: 0,
      discard: v.discardTop ? [v.discardTop] : [], discardBy: v.discardBy, stock: new Array(v.stockCount || 0), reshuffles: v.reshuffles,
      melds: v.melds, taken: {}, lastDrawn: v.lastDrawn, lastTaken: null, mustPlay: v.mustPlay || [],
      knock: { responses: Object.assign({}, v.knock.responses), order: [], deadline: 0 }, opts: {},
    };
    const me = players[seat], top = v.discardTop, L = (c) => cardLabel(c);
    if (v.phase === 'lastLay') {
      if (!v.lastLay || !v.lastLay.pending.includes(seat)) return null;
      const f = findContract(me.hand, R, false);
      if (f && f.melds && f.melds.length === R.slots.length) {
        const melds = f.melds.map((m) => m.cards.map((c) => c.id));
        return { text: 'Du kannst die Vorgabe noch auslegen – das spart Punkte! Vorschlag in die Sammelstapel legen?', ids: [].concat(...melds), melds };
      }
      return { text: 'Die Vorgabe hast du leider nicht zusammen – tippe auf „Nichts auslegen“.', ids: [] };
    }
    if (v.phase === 'knock') {
      if (!(v.knock.pending || []).includes(seat)) return null;
      return botWantsKnock(s, seat)
        ? { text: `Klopfen lohnt sich – ${L(top)} bringt dich deiner Vorgabe näher.`, ids: [] }
        : { text: `Lieber passen – ${L(top)} hilft dir kaum, und die Strafkarte kostet Punkte.`, ids: [] };
    }
    if (v.current !== seat) return null;
    if (v.phase === 'draw') {
      const a = botAction(s, seat) || { type: 'drawStock' };
      const take = a.type === 'takeDiscard';
      if (v.knock.first != null) {
        return take ? { text: `👎 ablehnen und ${L(top)} selbst von der Ablage nehmen – die Karte passt zu dir.`, ids: [] }
          : { text: `👍 zustimmen – ${L(top)} brauchst du nicht.`, ids: [] };
      }
      return take ? { text: `Nimm ${L(top)} von der Ablage – sie passt zu deinen Karten.`, ids: [], act: 'takeDiscard' }
        : { text: top ? `Zieh vom Stapel – ${L(top)} bringt dir wenig.` : 'Zieh vom Stapel.', ids: [], act: 'drawStock' };
    }
    if (v.phase !== 'play') return null;
    const a = botAction(s, seat);
    if (!a) return null;
    if (a.type === 'layDown') {
      return { text: R.fromHand ? 'Du kannst ausmachen! Vorschlag in die Sammelstapel legen?' : 'Du kannst die Vorgabe auslegen! Vorschlag in die Sammelstapel legen?', ids: [].concat(...a.melds), melds: a.melds };
    }
    if (a.type === 'layOff') {
      const c = me.hand.find((x) => x.id === a.cardIds[0]);
      const m = v.melds.find((x) => x.id === a.meldId);
      const swap = m && layOffResult(m, [c]).joker;
      return { text: swap ? `${L(c)} ersetzt einen Joker in der markierten Kombination – du bekommst den Joker zurück.` : `${L(c)} passt an die markierte Kombination.`, ids: [c.id], meldId: a.meldId };
    }
    if (a.type === 'discard') {
      const c = me.hand.find((x) => x.id === a.cardId);
      if (!c) return null;
      if (!me.down) {
        const near = progress(me.hand.filter((x) => x !== c), R);
        return { text: `Wirf ${L(c)} ab${near < 20 ? ' – dir fehlt nicht mehr viel' : ''}.`, ids: [c.id] };
      }
      return { text: `Nichts mehr anzulegen – wirf ${L(c)} ab (${cardPoints(c)} Punkte weniger auf der Hand).`, ids: [c.id] };
    }
    return null;
  }

  // ---------- Spielleitung mit Timern (Browser & Server) ----------
  class GameHost {
    constructor(players, opts) {
      this.opts = Object.assign({ botDelay: 900, knockMs: 7000, onChange: () => {}, isAuto: null }, opts || {});
      this.s = newGame(players, { knockMs: this.opts.knockMs, approveMs: this.opts.approveMs || 0 });
      this.timers = [];
      this._tick();
    }
    isAuto(seat) { return this.opts.isAuto ? this.opts.isAuto(seat, this.s) : this.s.players[seat].bot; }
    view(seat) { return view(this.s, seat); }
    act(seat, a) {
      const err = act(this.s, seat, a);
      if (!err) { this.opts.onChange(); this._tick(); }
      return err;
    }
    _clear() { this.timers.forEach(clearTimeout); this.timers = []; }
    _later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
    refresh() { this._tick(); }
    destroy() { this._clear(); this.dead = true; }
    _tick() {
      this._clear();
      if (this.dead) return;
      const s = this.s, seq = s.seq;
      s.autoSeats = s.players.map((_, i) => !!this.isAuto(i));
      if (s.phase === 'lastLay' && s.lastLay) {
        // Bots legen ihre Vorgabe aus, wenn sie können; Menschen haben bis zum Zeitlimit
        for (const i of s.lastLay.pending.filter((i) => this.isAuto(i))) {
          this._later(700 + Math.random() * 900, () => {
            if (s.phase !== 'lastLay' || !s.lastLay.pending.includes(i)) return;
            const a = botLastLay(s, i);
            if (act(s, i, a) && a.type === 'layDown') act(s, i, { type: 'lastPass' });
            this.opts.onChange(); this._tick();
          });
        }
        const ms = Math.max(0, s.lastLay.deadline - Date.now());
        this._later(ms + 50, () => { if (s.seq === seq && s.phase === 'lastLay') { act(s, null, { type: 'lastLayTimeout' }); this.opts.onChange(); this._tick(); } });
        return;
      }
      if (s.phase === 'knock') {
        const pend = knockPending(s);
        const autos = pend.filter((i) => this.isAuto(i));
        const left = Math.max(200, s.knock.deadline - Date.now() - 400);
        for (const i of autos) {
          // Bots überlegen kurz – so haben Menschen eine faire Chance, zuerst zu klopfen
          const a = botAction(s, i) || { type: 'pass' };
          const d = a.type === 'knock' ? 900 + Math.random() * 1800 : 300 + Math.random() * 600;
          this._later(Math.min(d, left), () => {
            if (s.phase !== 'knock' || s.knock.responses[i] !== undefined) return;
            if (!act(s, i, a)) { this.opts.onChange(); this._tick(); }
          });
        }
        const ms = Math.max(0, s.knock.deadline - Date.now());
        this._later(ms + 50, () => { if (s.seq === seq && s.phase === 'knock') this.act(null, { type: 'knockTimeout' }); });
        return;
      }
      if (s.phase === 'draw' && !this.isAuto(s.current) && s.knock.order.length && s.knock.approveDeadline) {
        // keine Antwort vom Spieler am Zug → automatisch zustimmen
        const ms = Math.max(0, s.knock.approveDeadline - Date.now());
        this._later(ms + 50, () => {
          if (s.seq !== seq || s.phase !== 'draw') return;
          if (!act(s, s.current, { type: 'drawStock' })) { this.opts.onChange(); this._tick(); }
        });
      }
      if (s.phase === 'draw' && !this.isAuto(s.current) && !s.knock.order.length) {
        // Bots klopfen, solange der Mensch am Zug noch überlegt – dann wird er gefragt (genehmigen / selbst nehmen)
        const cands = s.players.map((_, i) => i).filter((i) => i !== s.current && this.isAuto(i) && canKnock(s, i) && s.knock.responses[i] === undefined);
        for (const i of cands) {
          if (!botWantsKnock(s, i)) continue;
          this._later(1200 + Math.random() * 1600, () => {
            if (s.seq !== seq || s.phase !== 'draw' || (s.knock.order || []).length) return;
            if (!act(s, i, { type: 'knock' })) { this.opts.onChange(); this._tick(); }
          });
        }
      }
      if ((s.phase === 'draw' || s.phase === 'play') && this.isAuto(s.current)) {
        let delay = s.phase === 'draw' ? this.opts.botDelay * 1.2 : this.opts.botDelay;
        // Können Menschen um die offene Karte klopfen, überlegt der Bot länger – damit „Klopfen“ lange genug zu sehen ist
        if (s.phase === 'draw' && !s.knock.order.length && s.players.some((_, i) => i !== s.current && !this.isAuto(i) && canKnock(s, i))) delay = Math.max(delay, 5000);
        this._later(delay, () => {
          if (s.seq !== seq) return;
          const cur = s.current;
          let a = botAction(s, cur);
          let err = a ? act(s, cur, a) : 'none';
          if (err) {
            // Sicherheitsnetz: niemals hängen bleiben
            if (s.phase === 'draw') err = act(s, cur, { type: 'drawStock' });
            else if (s.phase === 'play') err = act(s, cur, { type: 'discard', cardId: s.players[cur].hand[0].id });
          }
          this.opts.onChange(); this._tick();
        });
      }
    }
  }

  return {
    SUITS, SUIT_SYM, SUIT_NAME, ROUNDS, TYPE_NAME, RANK_LABEL, isRed, rankLabel, normPos, cardLabel, cardPoints, handPoints,
    validMeld, runChoices, layOffResult, checkMeld, suggest, matchContract, slotLabel, fitsSlot, newGame, act, view, botAction, findContract, GameHost, canKnock, botLastLay,
  };
});

    [/([♠♥♦♣])B(?![A-Za-z])/g, '$1J'], [/([♠♥♦♣])D(?![A-Za-z])/g, '$1Q'],
  ];
  const EN_WORDS = {
    gruppe: 'group', gruppen: 'groups', sequenz: 'run', sequenzen: 'runs', karten: 'cards', karte: 'card', und: 'and',
    'à': 'of', paare: 'pairs', mind: 'min', rot: 'red', schwarz: 'black', stapel: 'stock', ablage: 'discard pile',
    runde: 'round', punkte: 'points', spieler: 'player', ohne: 'without', joker: 'joker', offline: 'offline',
  };

  const PACKS = { ksh: { phrases: KSH_PHRASES, words: KSH_WORDS }, en: { phrases: EN_PHRASES, words: EN_WORDS } };
  let pack = PACKS.ksh;
  const WORD_RE = /[A-Za-zÄÖÜäöüßà]+/g;
  function tword(w, off, str) {
    if (w.length > 1 && w === w.toUpperCase()) return w; // JOKER, NEU, Raumcodes …
    const k = pack.words[w.toLowerCase()];
    if (!k) return w;
    const first = typeof off !== 'number' || !/[A-Za-zÄÖÜäöüß]/.test(str.slice(0, off));
    if (w[0] !== w[0].toLowerCase() && (pack !== PACKS.en || first)) return k[0].toUpperCase() + k.slice(1);
    return k;
  }
  function koelsch(s) {
    if (!s || !pack || !/[A-Za-zÄÖÜäöüß]{1}/.test(s)) return s;
    const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s);
    return m[1] + core(m[2]) + m[3];
  }
  function core(s) {
    if (!s) return s;
    // Wendungen werden markiert (\u0001…\u0002), damit ihre kölschen Wörter nicht noch einmal ersetzt werden
    for (const [re, rep] of pack.phrases) s = s.replace(re, '\u0001' + rep + '\u0002');
    let out = '', depth = 0, buf = '';
    const flush = () => { out += depth ? buf : buf.replace(WORD_RE, tword); buf = ''; };
    for (const ch of s) {
      if (ch === '\u0001') { flush(); depth++; }
      else if (ch === '\u0002') { flush(); depth = Math.max(0, depth - 1); }
      else buf += ch;
    }
    flush();
    return out;
  }

  // ---- DOM-Übersetzung ----
  const done = new WeakMap(); // Textknoten → zuletzt geschriebener Text
  const doneAttr = new WeakMap();
  const ATTRS = ['title', 'aria-label', 'placeholder'];
  let on = false, obs = null;
  const SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT']);
  function skipEl(el) { return !el || SKIP.has(el.nodeName) || (el.closest && el.closest('[data-nok], .code, .nm')); }
  function doText(n) {
    if (done.get(n) === n.data) return;
    if (skipEl(n.parentElement)) return;
    const out = koelsch(n.data);
    if (out !== n.data) n.data = out;
    done.set(n, n.data);
  }
  function doAttrs(el) {
    if (skipEl(el)) return;
    let m = doneAttr.get(el);
    if (!m) { m = {}; doneAttr.set(el, m); }
    for (const a of ATTRS) {
      const v = el.getAttribute(a);
      if (v == null || m[a] === v) continue;
      const out = koelsch(v);
      if (out !== v) el.setAttribute(a, out);
      m[a] = out;
    }
  }
  function walk(root) {
    if (!root) return;
    if (root.nodeType === 3) return doText(root);
    if (root.nodeType !== 1) return;
    if (SKIP.has(root.nodeName)) return;
    doAttrs(root);
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    let n;
    while ((n = tw.nextNode())) { if (n.nodeType === 3) doText(n); else doAttrs(n); }
  }
  function setLang(lang) {
    pack = PACKS[lang] || null;
    enable(!!pack, lang);
  }
  function enable(v, lang) {
    on = !!v && !!pack;
    document.documentElement.lang = on ? (lang || 'ksh') : 'de';
    if (on) {
      walk(document.body);
      if (!obs) {
        obs = new MutationObserver((list) => {
          if (!on) return;
          for (const m of list) {
            if (m.type === 'childList') m.addedNodes.forEach(walk);
            else if (m.type === 'characterData') doText(m.target);
            else if (m.type === 'attributes') doAttrs(m.target);
          }
        });
      }
      obs.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });
    } else if (obs) obs.disconnect();
  }
  window.Koelsch = { enable: (v) => setLang(v ? 'ksh' : 'de'), translate: koelsch, get on() { return on; } };
  window.I18n = { setLang, translate: (t, lang) => { const old = pack; pack = PACKS[lang] || pack; const r = koelsch(t); pack = old; return r; } };
})();

<script>
/* Skalamala – Musik (eigener Schunkelwalzer) und Geräusche, komplett im Browser erzeugt (Web Audio). */
(function () {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem('skalamala.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('skalamala.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const cfg = {
    musicOn: store.get('musicOn', true), musicVol: store.get('musicVol', 30),
    sfxOn: store.get('sfxOn', true), sfxVol: store.get('sfxVol', 70),
  };
  let ac = null, musicBus = null, sfxBus = null, loopTimer = null, nextAt = 0, unlocked = false;

  function ctx() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      musicBus = ac.createGain(); musicBus.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.connect(ac.destination);
      applyVol();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function applyVol() {
    if (!ac) return;
    musicBus.gain.value = cfg.musicOn ? (cfg.musicVol / 100) * 0.6 : 0;
    sfxBus.gain.value = cfg.sfxOn ? (cfg.sfxVol / 100) * 0.9 : 0;
  }
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function lp(f, bus) { const x = ac.createBiquadFilter(); x.type = 'lowpass'; x.frequency.value = f; x.connect(bus); return x; }
  function tone(t, m, d, type, vol, dest, det) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = hz(m); if (det) o.detune.value = det;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.015);
    g.gain.setValueAtTime(vol * 0.8, t + Math.max(0.03, d * 0.6)); g.gain.linearRampToValueAtTime(0, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.05);
  }
  function noise(t, d, vol, ftype, f, q) {
    const n = Math.max(1, Math.floor(ac.sampleRate * d)), b = ac.createBuffer(1, n, ac.sampleRate), c = b.getChannelData(0);
    for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(); s.buffer = b;
    const fl = ac.createBiquadFilter(); fl.type = ftype; fl.frequency.value = f; fl.Q.value = q || 1;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(fl); fl.connect(g); g.connect(sfxBus); s.start(t);
  }

  // ---- Musik A: Schunkelwalzer (eigene Komposition) ----
  const CH = { F: [53, 57, 60], Bb: [58, 62, 65], C: [55, 60, 64], C7: [55, 58, 64], Gm: [55, 58, 62] };
  const BS = { F: 41, Bb: 46, C: 48, C7: 48, Gm: 43 };
  const MEL = [[72, 2], [69, 1], [77, 2], [76, 1], [74, 1.5], [72, 0.5], [70, 1], [69, 3], [70, 2], [74, 1], [79, 2], [77, 1], [76, 1], [74, 1], [76, 1], [72, 3],
    [72, 2], [69, 1], [77, 2], [81, 1], [79, 1.5], [77, 0.5], [74, 1], [72, 3], [70, 2], [67, 1], [72, 2], [76, 1], [76, 1], [79, 1], [76, 1], [77, 3]];
  const CHORDS = ['F', 'F', 'Bb', 'F', 'Bb', 'Gm', 'C', 'C', 'F', 'F', 'Bb', 'F', 'Gm', 'C', 'C7', 'F'];
  const BEAT = 60 / 150, BAR = 3 * BEAT, TOTAL = CHORDS.length * BAR;
  function schedule(t0) {
    const f = lp(1800, musicBus), f2 = lp(1200, musicBus);
    let t = t0;
    for (const [m, d] of MEL) { tone(t, m, d * BEAT * 0.95, 'sawtooth', 0.09, f, -7); tone(t, m, d * BEAT * 0.95, 'sawtooth', 0.09, f, 7); t += d * BEAT; }
    CHORDS.forEach((c, i) => {
      const bt = t0 + i * BAR;
      tone(bt, BS[c], BEAT * 0.8, 'triangle', 0.28, musicBus);
      for (let k = 1; k < 3; k++) CH[c].forEach((n) => tone(bt + k * BEAT, n, BEAT * 0.45, 'square', 0.025, f2));
    });
  }
  function startMusic() {
    if (!cfg.musicOn || loopTimer || !ctx()) return;
    nextAt = ac.currentTime + 0.1;
    schedule(nextAt); nextAt += TOTAL;
    loopTimer = setInterval(() => {
      if (ac.state !== 'running') return;
      if (nextAt < ac.currentTime) nextAt = ac.currentTime + 0.1; // nach Pause/Hintergrund wieder sauber einsetzen
      if (ac.currentTime > nextAt - 1.5) { schedule(nextAt); nextAt += TOTAL; }
    }, 300);
  }
  function stopMusic() {
    if (loopTimer) clearInterval(loopTimer);
    loopTimer = null;
    if (ac) { musicBus.disconnect(); musicBus = ac.createGain(); musicBus.connect(ac.destination); applyVol(); }
  }

  // ---- Geräusche ----
  function tusch(t, big) {
    const f = lp(2400, sfxBus);
    const seq = big ? [[60, 64, 67], [60, 64, 67], [60, 64, 67], [65, 69, 72], [65, 69, 72], [65, 69, 72], [67, 72, 76]] : [[60, 64, 67], [65, 69, 72]]; // Auslegen: kurzes „ta-taa“
    seq.forEach((c, i) => {
      const last = i === seq.length - 1, d = last ? (big ? 1.6 : 1.1) : 0.12, st = t + i * 0.16;
      c.forEach((n) => { tone(st, n, d, 'sawtooth', 0.06, f); tone(st, n + 12, d, 'square', 0.03, f); });
      tone(st, c[0] - 24, d, 'triangle', 0.25, sfxBus);
    });
    noise(t + (seq.length - 1) * 0.16, big ? 1.4 : 1, 0.18, 'highpass', 5000);
  }
  const FX = {
    click() { const t = ac.currentTime; noise(t, 0.03, 0.35, 'highpass', 3000); },
    draw() {
      const t = ac.currentTime, n = Math.floor(ac.sampleRate * 0.25), b = ac.createBuffer(1, n, ac.sampleRate), c = b.getChannelData(0);
      for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
      const s = ac.createBufferSource(); s.buffer = b;
      const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 1.5;
      fl.frequency.setValueAtTime(800, t); fl.frequency.linearRampToValueAtTime(4000, t + 0.22);
      const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t + 0.05); g.gain.linearRampToValueAtTime(0, t + 0.24);
      s.connect(fl); fl.connect(g); g.connect(sfxBus); s.start(t);
    },
    discard() { const t = ac.currentTime; noise(t, 0.08, 0.5, 'lowpass', 900); tone(t, 45, 0.12, 'sine', 0.4, sfxBus); },
    knock() { const t = ac.currentTime; [0, 0.16].forEach((o) => { noise(t + o, 0.07, 0.7, 'bandpass', 420, 4); tone(t + o, 52, 0.08, 'sine', 0.5, sfxBus); }); },
    tusch() { tusch(ac.currentTime, false); },
    win() { tusch(ac.currentTime, true); },
  };
  let lastFx = {};
  function play(name) {
    if (!cfg.sfxOn || !unlocked || !ctx() || !FX[name]) return;
    const now = Date.now();
    if (lastFx[name] && now - lastFx[name] < 60) return; // keine Doppel-Auslösung
    lastFx[name] = now;
    try { FX[name](); } catch (e) {}
  }

  // Browser erlauben Ton erst nach einer Berührung/einem Klick
  // Bei jeder Berührung prüfen, ob der Ton (z. B. nach Sperrbildschirm, Tab-Wechsel, Vollbild) wieder geweckt werden muss
  function unlock() {
    unlocked = true;
    const a = ctx();
    if (a && a.state !== 'running') { try { a.resume(); } catch (e) {} }
    if (cfg.musicOn && cfg.musicVol > 0) startMusic();
  }
  ['pointerdown', 'pointerup', 'keydown', 'touchstart', 'touchend', 'click'].forEach((ev) => window.addEventListener(ev, unlock, { capture: true, passive: true }));
  // Wächter: hat der Browser den Ton angehalten (Kopfhörer gewechselt, Energiesparen, anderer Ton …), wieder wecken
  setInterval(() => {
    if (!unlocked || !ac || document.hidden) return;
    if (ac.state === 'closed') {
      if (loopTimer) clearInterval(loopTimer);
      loopTimer = null; ac = null;
      if (ctx() && cfg.musicOn && cfg.musicVol > 0) startMusic();
      return;
    }
    if (ac.state !== 'running') { try { ac.resume(); } catch (e) {} }
  }, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && unlocked && ac && ac.state !== 'running') { try { ac.resume(); } catch (e) {} } });

  function set(k, v) {
    cfg[k] = v; store.set(k, v);
    applyVol();
    if (k === 'musicOn' || k === 'musicVol') { if (cfg.musicOn && cfg.musicVol > 0 && unlocked) startMusic(); if (!cfg.musicOn) stopMusic(); }
  }
  window.SkSound = { play, set, get: (k) => cfg[k], cfg };
})();

</script>

  function sortPile(cards, R) {
    if (cards.length < 2) return cards;
    const firstJ = cards[0].joker && !cards[cards.length - 1].joker ? 'low' : undefined;
    for (const t of ['A', 'S']) {
      if (!R.slots.some((x) => x.t === t) && !(t === 'S' && R.slots.some((x) => x.t === 'A'))) continue;
      const arr = E.validMeld(cards, t, 0, firstJ);
      if (arr) return arr.map((x) => x.card);
    }
    return cards.slice().sort((a, b) => (a.joker ? 1 : 0) - (b.joker ? 1 : 0) || a.rank - b.rank || SUIT_ORDER[a.suit] - SUIT_ORDER[b.suit]);
  }
  function pileStatus(cards, R) {
    const n = cards.length;
    if (n === 1) return { cls: 'part', label: 'Stapel (1)' };
    for (const sl of R.slots) if (E.fitsSlot(cards, sl)) return { cls: 'ok', label: `✓ ${E.TYPE_NAME[sl.t]}` };
    for (const sl of R.slots) if (sl.exact && n > sl.min && E.validMeld(cards, sl.t, sl.min)) return { cls: 'bad', label: `${E.TYPE_NAME[sl.t]}: nur ${sl.min} Karten!` };
    const types = [...new Set(R.slots.map((x) => x.t))];
    for (const t of types) {
      if (E.validMeld(cards, t)) {
        const min = Math.min(...R.slots.filter((x) => x.t === t).map((x) => x.min));
        return { cls: 'part', label: `${E.TYPE_NAME[t]} – noch ${min - n}` };
      }
    }
    // gültig, aber nicht gesucht (z. B. Sequenz in einer Gruppen-Runde): nur zum Sammeln
    if (E.validMeld(cards, 'G') || E.validMeld(cards, 'S')) return { cls: 'part', label: `Stapel (${n})` };
    return { cls: 'bad', label: n === 1 ? 'Stapel (1)' : 'passt nicht' };
  }
  // Ergeben die ausgewählten Karten (zusammen mit gültigen Stapeln) die Vorgabe? Dann automatisch aufteilen.
  function contractFromSelection(v) {
    const R = v.roundInfo;
    const byId = new Map(v.hand.map((c) => [c.id, c]));
    const pileIds = new Set([].concat(...ui.piles));
    const cards = [...new Set(ui.selected.concat(...ui.piles))].map((id) => byId.get(id)).filter(Boolean);
    if (cards.length < R.slots.reduce((t, x) => t + x.min, 0)) return null;
    const f = E.findContract(cards, R, R.slots.some((x) => !x.exact), 8000);
    if (!f || f.left.length) return null;
    if (!E.matchContract(f.melds.map((m) => m.cards), R.slots)) return null;
    return { used: [], auto: true, melds: f.melds.map((m) => m.cards.map((c) => c.id)) };
  }

  // Welche Sammelstapel ergeben zusammen die Vorgabe der Runde?
  function contractFromPiles(v) {
    const R = v.roundInfo, k = R.slots.length;
    const byId = new Map(v.hand.map((c) => [c.id, c]));
    const piles = ui.piles.map((p) => p.map((id) => byId.get(id)).filter(Boolean));
    const idx = piles.map((_, i) => i);
    let found = null;
    (function choose(start, acc) {
      if (found) return;
      if (acc.length === k) {
        if (E.matchContract(acc.map((i) => piles[i]), R.slots)) found = acc.slice();
        return;
      }
      for (let i = start; i < idx.length; i++) { acc.push(i); choose(i + 1, acc); acc.pop(); }
    })(0, []);
    if (!found) return null;
    return { used: found, melds: found.map((i) => piles[i].map((c) => c.id)) };
  }

  // Passen die (vorgemerkten) Kombinationen auf verschiedene Vorgaben?
  function partialMatch(melds, slots) {
    if (melds.length > slots.length) return false;
    const used = slots.map(() => false);
    const bt = (i) => {
      if (i === melds.length) return true;
      for (let k = 0; k < slots.length; k++) {
        if (used[k] || !E.fitsSlot(melds[i], slots[k])) continue;
        used[k] = true;
        if (bt(i + 1)) return true;
        used[k] = false;
      }
      return false;
    };
    return bt(0);
  }

  // ---------- Zustand der Oberfläche ----------

    order: [], orderRound: -1, dragging: false, pendingRender: false,

    view: null,
    room: null,
    selected: [],
    piles: [],      // Sammelstapel: Arrays von Karten-IDs

  // ---------- Steuerung lokal (gegen Bots) ----------
  const BOT_NAMES = ['Sabine', 'Hennes', 'Tünnes', 'Mariechen', 'Jupp', 'Kättchen', 'Pitter'];
  class LocalCtl {
    constructor(name, nBots) {
      this.mode = 'local';
      this.tips = ui.tips;
      this.players = [{ name, bot: false }].concat(
        BOT_NAMES.slice().sort(() => Math.random() - 0.5).slice(0, nBots).map((n) => ({ name: n + ' 🤖', bot: true })));
      this.start();
    }
    start() {
      if (this.host) this.host.destroy();
      this.host = new E.GameHost(this.players, { botDelay: store.get('botDelay', 950), knockMs: 7000, onChange: () => this.emit() });
      this.emit();
    }
    emit() {
      const v = this.host.view(0);
      v.host = 0;
      v.tips = this.tips;
      v.players.forEach((p) => (p.connected = true));
      onView(v);
    }
    act(a) { const e = this.host.act(0, a); if (e) toast(e); }
    again() { this.start(); }
    leave() { this.host.destroy(); }
  }

  // ---------- Steuerung online ----------
  class OnlineCtl {
    constructor(intent) {
      this.mode = 'online';
      this.intent = intent; // {t:'create'|'join', name, code, token}
      this.closedByUser = false;
      this.retry = 0;
      this.connect();
    }
    connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      let ws;
      try { ws = new WebSocket(`${proto}//${location.host}/ws`); } catch (e) { toast('Keine Verbindung zum Server möglich.'); return; }
      this.ws = ws;
      ws.onopen = () => {
        this.retry = 0;
        const sess = store.get('session', null);
        if (this.joined && sess) ws.send(JSON.stringify({ t: 'join', code: sess.code, token: sess.token, name: ui.name }));
        else ws.send(JSON.stringify(this.intent));
        clearInterval(this.pinger);
        this.pinger = setInterval(() => { try { ws.send('{"t":"ping"}'); } catch (e) {} }, 20000);
      };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'welcome') { this.joined = true; this.seat = m.seat; store.set('session', { code: m.code, token: m.token }); }
        else if (m.t === 'room') { ui.room = m.room; if (!m.room.started) { if (ui.modalKind === 'roundEnd') closeModal(); ui.view = null; go('lobby'); } }
        else if (m.t === 'state') { onView(m.view); }
        else if (m.t === 'error') { toast(m.msg, 3500); if (!this.joined && /nicht gefunden|läuft bereits|voll/.test(m.msg)) { store.del('session'); this.leave(); go('home'); } }
        else if (m.t === 'kicked') { toast('Du wurdest aus dem Raum entfernt.'); store.del('session'); this.leave(); go('home'); }
        else if (m.t === 'left') { /* ok */ }
      };
      ws.onclose = () => {
        clearInterval(this.pinger);
        if (this.closedByUser) return;
        this.retry++;
        if (this.retry === 2) toast('Verbindung unterbrochen – verbinde neu…');
        setTimeout(() => this.connect(), Math.min(8000, 500 * this.retry));
      };
    }
    send(o) { try { this.ws.send(JSON.stringify(o)); } catch (e) { toast('Nicht verbunden.'); } }
    act(a) { this.send({ t: 'act', a }); }
    again() { this.send({ t: 'again' }); }
    leave() {
      this.closedByUser = true;
      try { this.ws.send(JSON.stringify({ t: 'leave' })); } catch (e) {}
      try { this.ws.close(); } catch (e) {}
      clearInterval(this.pinger);
    }
  }

  // ---------- Navigation ----------
  function go(screen) { ui.screen = screen; render(); }

  // Geräusche aus den Spielereignissen ableiten
  function playEvents(prev, v) {
    const S = window.SkSound;
    if (!S || !prev || prev.round !== v.round) return;
    const ended = (v.phase === 'lastLay' && prev.phase !== 'lastLay') || ((v.phase === 'roundEnd' || v.phase === 'gameEnd') && prev.phase !== v.phase && prev.phase !== 'lastLay');
    if (ended) return S.play('win');
    const downs = (x) => x.players.filter((p) => p.down).length;
    if (downs(v) > downs(prev)) return S.play('tusch');
    const knocks = (x) => Object.values(x.knock.responses || {}).filter((r) => r === 'knock').length;
    if (knocks(v) > knocks(prev)) S.play('knock');
    if (v.stockCount < prev.stockCount || (v.discardCount < prev.discardCount && v.phase === 'play')) S.play('draw');
    else if (v.discardCount > prev.discardCount) S.play('discard');
  }

  // Ton-Einstellungen (Musik / Geräusche: an/aus + Lautstärke)
  function soundControls() {
    const S = window.SkSound;
    if (!S) return '';
    const row = (k, label) => `<div class="sndrow">
        <button class="btn small ${S.get(k + 'On') ? 'on' : ''}" data-a="snd" data-k="${k}On">${S.get(k + 'On') ? '🔊' : '🔇'} ${label}</button>
        <input type="range" min="0" max="100" step="5" value="${S.get(k + 'Vol')}" data-snd="${k}Vol" aria-label="${label} Lautstärke">
      </div>`;
    return `<div class="sndbox">${row('music', 'Musik')}${row('sfx', 'Geräusche')}</div>`;
  }
  document.addEventListener('input', (e) => {
    const k = e.target && e.target.dataset && e.target.dataset.snd;
    if (!k || !window.SkSound) return;
    window.SkSound.set(k, +e.target.value);
    const on = k.replace('Vol', 'On');
    if (+e.target.value > 0 && !window.SkSound.get(on)) { window.SkSound.set(on, true); }
  });

  function onView(v) {
    const prev = ui.view;
    ui.view = v;
    ui.clockAt = Date.now();
    if (ui.screen !== 'game') ui.screen = 'game';
    // Auswahl bereinigen
    const ids = new Set(v.hand.map((c) => c.id));
    // zuletzt bekommene Karte(n) merken (gezogen, von der Ablage oder beim Klopfen)
    if (!prev || prev.round !== v.round) ui.newIds = [];
    else {
      const old = new Set(prev.hand.map((c) => c.id));
      const added = v.hand.filter((c) => !old.has(c.id)).map((c) => c.id);
      // NEU bleibt stehen, bis neue Karten dazukommen (z. B. geklopfte Karte + Strafkarte bis zum nächsten Ziehen)
      if (added.length) ui.newIds = added;
      // vom Server gemeldet, was ich zuletzt bekommen habe (z. B. geklopfte Karte + Strafkarte)
      if (v.gotSeq && v.gotSeq !== prev.gotSeq && v.got && v.got.length) ui.newIds = v.got.slice();
      playEvents(prev, v);
    }
    ui.newIds = (ui.newIds || []).filter((id) => ids.has(id));
    ui.selected = ui.selected.filter((id) => ids.has(id));
    const key = `${v.round}|${v.current}|${v.phase === 'play' ? 'p' : 'x'}`;
    if (ui.pilesRound !== v.round) { ui.piles = []; ui.pilesRound = v.round; }
    ui.piles = ui.piles.map((p) => p.filter((id) => ids.has(id))).filter((p) => p.length);
    // Mein Zug?
    const turnKey = `${v.round}|${v.current}|${v.seq}`;
    if (v.current === v.seat && v.phase === 'draw' && (!prev || prev.current !== v.seat || prev.phase !== 'draw')) { vibrate(60); }
    // Klopf-Zeitfenster
    if (v.phase === 'knock') {
      if (!prev || prev.phase !== 'knock') ui.knockStart = Date.now();
      const k = `${v.round}|${v.current}|${v.discardTop && v.discardTop.id}`;
      if (v.knock.pending.includes(v.seat) && !ui.knockPrompt && ui.autoPassed !== k) { ui.autoPassed = k; ui.ctl.act({ type: 'pass' }); }
    }
    if (v.current === v.seat && v.phase === 'draw' && v.knock.first != null && !(prev && prev.knock && prev.knock.first != null && prev.current === v.current && prev.phase === 'draw')) ui.approveStart = Date.now();
    ui.lastTurnKey = turnKey;
    render();
    // Rundenende
    if ((v.phase === 'roundEnd' || v.phase === 'gameEnd') && (!prev || prev.phase !== v.phase || prev.round !== v.round)) showRoundEnd();
    else if (v.phase === 'roundEnd' && ui.modalKind === 'roundEnd' && v.multi) showRoundEnd();
    if (v.phase !== 'roundEnd' && v.phase !== 'gameEnd' && ui.modalKind === 'roundEnd') closeModal();
  }
