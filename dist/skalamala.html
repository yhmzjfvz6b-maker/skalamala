    radial-gradient(110% 75% at 50% 30%, var(--blue-1) 0%, var(--blue-2) 38%, var(--blue-3) 72%, var(--blue-4) 100%);
  background-attachment: fixed;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
body::before { /* Sternenfunkeln wie im Logo */
  content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .55;
  background-image:
    radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(2px 2px at 82% 12%, var(--yellow) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 64% 42%, #fff 50%, transparent 51%),
    radial-gradient(2px 2px at 27% 71%, var(--sky) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 91% 66%, #fff 50%, transparent 51%),
    radial-gradient(2.5px 2.5px at 45% 88%, var(--yellow) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 52%, #fff 50%, transparent 51%);
  background-size: 420px 420px;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input { font: inherit; }
img { display: block; max-width: 100%; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Buttons: dicke "Spiel-Knöpfe" ---------- */
.btn {
  --bg: #2f6fe8; --bg2: #1b4fc4; --edge: #0e2f86; --fg: #fff;
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  min-height: 46px; padding: .5em 1.15em; border-radius: 16px;
  background: linear-gradient(180deg, var(--bg), var(--bg2)); color: var(--fg);
  border: 2px solid rgba(255,255,255,.55);
  box-shadow: 0 4px 0 var(--edge), 0 8px 16px rgba(0,0,0,.25);
  font-family: var(--display); font-weight: 400; font-size: 1.05rem; letter-spacing: .02em;
  text-shadow: 0 1px 0 rgba(0,0,0,.25);
  transition: transform .08s, box-shadow .08s, filter .15s, opacity .15s;
  white-space: nowrap; position: relative; top: 0;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge), 0 4px 8px rgba(0,0,0,.25); }
.btn:disabled { opacity: .4; pointer-events: none; filter: saturate(.4); }
.btn.primary { --bg: var(--yellow-2); --bg2: var(--orange); --edge: #b84a00; --fg: #6b1500; text-shadow: 0 1px 0 rgba(255,255,255,.5); border-color: #fff6c4; }
.btn.green { --bg: #43d167; --bg2: #1f9a3e; --edge: #126228; }
.btn.danger { --bg: #ff5a5f; --bg2: var(--red-2); --edge: #6e0b10; }
.btn.knock { --bg: #ff7a3d; --bg2: var(--red); --edge: #7a0f12; }
.btn.white { --bg: #ffffff; --bg2: #e6ecfb; --edge: #8a96b8; --fg: var(--navy); text-shadow: none; }
.btn.ghost { --bg: rgba(255,255,255,.14); --bg2: rgba(255,255,255,.06); --edge: rgba(0,0,0,.35); border-color: rgba(255,255,255,.3); }
.btn.small { min-height: 34px; padding: .25em .8em; font-size: .9rem; border-radius: 12px; box-shadow: 0 3px 0 var(--edge); }
.btn.icon { width: 42px; min-height: 42px; padding: 0; font-size: 1.15rem; border-radius: 50%; }

/* ---------- Startseite ---------- */
.home { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: max(16px, env(safe-area-inset-top)) 16px 32px; gap: 18px; position: relative; overflow-x: hidden; }
.logo { position: relative; width: min(300px, 62vw); margin-top: 1vh; display: grid; place-items: center; }
.logo img { position: relative; z-index: 1; width: 100%; height: auto; aspect-ratio: 720 / 484; object-fit: contain; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); animation: bob 4.5s ease-in-out infinite; }
.burst { /* Strahlenkranz hinter dem Logo */
  position: absolute; z-index: 0; width: 140%; aspect-ratio: 1; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255,226,94,.20) 0 9deg, transparent 9deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 66%); mask: radial-gradient(circle, #000 18%, transparent 66%);
  animation: spin 60s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-6px) rotate(.6deg); } }
.tagline { font-family: var(--display); color: var(--yellow); font-size: 1.05rem; text-align: center; margin: -6px 0 0; text-shadow: 0 2px 0 var(--blue-4); letter-spacing: .02em; }
.panel {
  width: min(520px, 100%); background: var(--panel);
  border: 3px solid rgba(255,255,255,.9); border-radius: 26px; padding: 18px 18px 20px;
  box-shadow: 0 8px 0 rgba(4,14,58,.65), 0 18px 40px rgba(0,0,0,.35);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.panel h2 {
  margin: 0 0 12px; font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: .02em;
  color: var(--yellow); text-shadow: 0 2px 0 var(--red-2), 0 3px 6px rgba(0,0,0,.3);
}
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: .9rem; color: var(--muted); font-weight: 700; }
.input {
  width: 100%; min-height: 50px; padding: 10px 16px; border-radius: 14px;
  border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.95); color: var(--navy); font-size: 1.1rem; font-weight: 800;
  -webkit-user-select: text; user-select: text;
}
.input::placeholder { color: #8a94b8; font-weight: 600; }
.input:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.grow > * { flex: 1; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.25); border-radius: 999px; padding: 4px; border: 2px solid var(--line); }
.stepper b { min-width: 2em; text-align: center; font-size: 1.35rem; font-family: var(--display); font-weight: 400; color: var(--yellow); }
.stepper .btn { min-height: 38px; width: 38px; padding: 0; border-radius: 50%; box-shadow: 0 3px 0 var(--edge); }
.hint { color: var(--muted); font-size: .9rem; line-height: 1.45; margin: 10px 0 0; font-weight: 600; }
.toggle { display: flex; gap: 10px; align-items: center; font-size: .94rem; color: var(--muted); margin-top: 14px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--orange); flex: none; }
.linkbtn { color: var(--yellow); text-decoration: underline; text-underline-offset: 3px; font-weight: 800; font-size: 1rem; }
.divider { height: 2px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.3) 0 8px, transparent 8px 14px); margin: 18px 0; }

/* ---------- Lobby ---------- */
.lobbylogo { width: min(300px, 70vw); height: auto; aspect-ratio: 720 / 484; object-fit: contain; filter: drop-shadow(0 8px 14px rgba(0,0,0,.3)); }
.lobby .code {
  font-family: var(--display); font-size: clamp(48px, 14vw, 72px); letter-spacing: .16em; text-align: center; margin: 2px 0 8px;
  color: var(--yellow); text-shadow: 0 3px 0 var(--red-2), 0 6px 0 rgba(4,14,58,.6);
}
.seats { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-direction: column; gap: 8px; }
.seats li { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 16px; background: rgba(255,255,255,.1); border: 2px solid var(--line); }
.seats li .nm { flex: 1; font-weight: 800; }
.badge { font-size: .72rem; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.badge.gold { background: var(--yellow); color: #6b1500; }

/* Avatar-Kreise in Logo-Farben */
.av {
  --c: var(--green);
  position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.45), transparent 45%), var(--c);
  border: 3px solid #fff; display: grid; place-items: center;
  font-family: var(--display); font-size: 1.15rem; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3);
  box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.av .cnt {
  position: absolute; right: -8px; bottom: -6px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px;
  background: #fff; color: var(--navy); font-family: var(--body); font-weight: 900; font-size: .74rem;
  display: grid; place-items: center; text-shadow: none; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.av.off { filter: grayscale(1); opacity: .6; }

/* ---------- Spieltisch ---------- */
.game {
  height: 100dvh; display: grid; width: 100%; overflow: hidden;
  grid-template-rows: auto auto minmax(0, 1fr) auto auto;
  grid-template-columns: minmax(0, 1fr);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px;
  background: linear-gradient(180deg, rgba(7,26,92,.92), rgba(7,26,92,.75));
  border-bottom: 3px solid var(--yellow); box-shadow: 0 4px 12px rgba(0,0,0,.25);
}
.toplogo { height: 40px; width: auto; aspect-ratio: 720 / 484; object-fit: contain; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
.contract { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.roundchip {
  flex: none; background: linear-gradient(180deg, var(--yellow-2), var(--orange)); color: #6b1500;
  font-family: var(--display); border-radius: 12px; padding: 4px 10px; font-size: .95rem; border: 2px solid #fff;
  box-shadow: 0 2px 0 #b84a00;
}
.contract .txt { min-width: 0; line-height: 1.12; }
.contract .ttl { font-family: var(--display); font-size: 1.08rem; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contract .det { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.contract .det.warn { color: var(--yellow); }

.players { display: flex; gap: 10px; padding: 12px 10px 8px; overflow-x: auto; scrollbar-width: none; }
.players::-webkit-scrollbar { display: none; }
.pchip {
  flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 999px;
  background: rgba(7,26,92,.6); border: 2px solid var(--line); min-width: 0; position: relative;
  transition: box-shadow .2s, border-color .2s, transform .2s;
}
.pchip.turn { border-color: var(--yellow); background: rgba(255,210,63,.18); box-shadow: 0 0 0 3px rgba(255,210,63,.35), 0 0 22px rgba(255,210,63,.45); transform: translateY(-1px); }
.pchip.me .pn::after { content: ' (du)'; color: var(--yellow); font-weight: 800; }
.pchip.me .av { border-color: var(--yellow); }
.pchip.off { opacity: .6; }
.pchip .pn { font-weight: 800; font-size: .92rem; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip .ps { font-size: .74rem; color: var(--muted); font-weight: 700; }
.pchip .tags { position: absolute; top: -9px; right: -2px; display: flex; gap: 3px; }
.pchip .tag { font-size: .64rem; font-weight: 900; padding: 1px 7px; border-radius: 999px; background: var(--green); color: #fff; border: 2px solid #fff; }
.pchip .tag.k { background: var(--red); }
.pchip .tag.d { background: var(--yellow); color: #6b1500; }

.table { overflow-y: auto; overflow-x: hidden; padding: 4px 10px 12px; -webkit-overflow-scrolling: touch; }
.piles { display: flex; justify-content: center; align-items: flex-end; gap: clamp(18px, 6vw, 48px); padding: 10px 0 6px; }
.pile { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.pile .card, .pile .back { --cw: var(--pw); }
.pile .lbl { font-size: .8rem; color: #fff; font-weight: 800; letter-spacing: .03em; background: rgba(7,26,92,.55); padding: 1px 10px; border-radius: 999px; }
.pile.clickable .card, .pile.clickable .back { animation: pulse 1.3s ease-in-out infinite; cursor: pointer; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,210,63,0), 0 5px 0 rgba(0,0,0,.2); } 50% { box-shadow: 0 0 0 6px rgba(255,210,63,.75), 0 5px 0 rgba(0,0,0,.2); } }
.back { /* Kartenrücken: blau mit gelbem Stern, wie die Logo-Karten */
  width: var(--cw); height: calc(var(--cw) * 1.42); border-radius: calc(var(--cw) * .13);
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.18) 0 22%, transparent 23%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 5px, transparent 5px 10px),
    linear-gradient(160deg, #3d86ff, #1746c4);
  border: 3px solid #fff; outline: 2px solid rgba(7,26,92,.5);
  box-shadow: 0 5px 0 rgba(0,0,0,.2), 4px 4px 0 -1px #dfe7ff, 8px 8px 0 -2px #b9c9f5;
  display: grid; place-items: center; position: relative;
}
.back::before { content: '★'; position: absolute; color: var(--yellow); font-size: calc(var(--cw) * .5); text-shadow: 0 2px 0 var(--orange-2); }
.back span { position: relative; z-index: 1; margin-top: calc(var(--cw) * .95); font-family: var(--display); font-size: calc(var(--cw) * .2); color: #fff; text-shadow: 0 2px 0 var(--blue-4); }
.knockbox { position: absolute; left: 50%; transform: translateX(-50%); bottom: -54px; white-space: nowrap; }

.slots { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.slot { font-size: .78rem; padding: 3px 11px; border-radius: 999px; border: 2px dashed rgba(255,255,255,.5); color: #fff; font-weight: 800; }
.slot.done { border-style: solid; border-color: var(--green); background: rgba(43,178,76,.25); }

.meldarea { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.mgroup { background: rgba(7,26,92,.5); border: 2px solid var(--line); border-radius: 18px; padding: 8px 10px 10px; }
.mgroup .who { display: flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 800; margin: 0 0 8px 2px; }
.mgroup .who .av { width: 26px; height: 26px; font-size: .8rem; border-width: 2px; }
.mrow { display: flex; flex-wrap: wrap; gap: 10px; }
.meld { display: flex; padding: 4px 6px 4px 4px; border-radius: 12px; background: rgba(255,255,255,.08); border: 2px solid transparent; transition: border-color .15s, background .15s; }
.meld .card { --cw: var(--mw); margin-right: calc(var(--mw) * -.52); box-shadow: -1px 0 3px rgba(0,0,0,.25); border-width: 1px; }
.meld .card:last-child { margin-right: 0; }
.meld.target { border-color: var(--yellow); background: rgba(255,210,63,.2); cursor: pointer; animation: pulse 1.3s infinite; }
.meld .mt { writing-mode: vertical-rl; transform: rotate(180deg); font-size: .6rem; color: var(--yellow); margin-right: 4px; letter-spacing: .08em; text-transform: uppercase; font-weight: 900; }
.empty-table { text-align: center; color: var(--muted); font-size: .95rem; padding: 16px 0; font-weight: 700; }

.dock { padding: 6px 10px; }
.status { text-align: center; font-size: 1.02rem; min-height: 1.4em; margin-bottom: 2px; text-wrap: balance; font-weight: 800; }
.status.mine { font-family: var(--display); font-weight: 400; font-size: 1.18rem; color: var(--yellow); text-shadow: 0 2px 0 var(--red-2); letter-spacing: .01em; }
.lastlog { text-align: center; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.2em; font-weight: 700; }
.staging { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px; justify-content: center; flex-wrap: wrap; }
.staged { display: flex; align-items: center; padding: 4px; border-radius: 12px; background: rgba(43,178,76,.25); border: 2px solid var(--green); }
.staged .card { --cw: var(--mw); margin-right: calc(var(--mw) * -.52); }
.staged .card:last-of-type { margin-right: 4px; }
.staged button { width: 28px; height: 28px; border-radius: 50%; background: var(--red); color: #fff; font-weight: 900; border: 2px solid #fff; font-size: .8rem; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 6px 0 8px; }

.handwrap {
  padding: 6px 8px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(7,26,92,.75), rgba(4,14,58,.95));
  border-top: 3px solid var(--yellow); box-shadow: 0 -6px 16px rgba(0,0,0,.25);
}
.handbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); padding: 2px 4px 4px; font-weight: 800; }
.handbar > span:last-child { display: flex; gap: 6px; flex: none; }
.hand { position: relative; display: flex; overflow: hidden; width: 100%; padding-top: 24px; padding-bottom: 8px; min-height: calc(var(--cw) * 1.42 + 24px); }
.hand .card { flex: none; transition: transform .14s ease, margin .2s; cursor: pointer; }
.hand .card.sel { transform: translateY(-20px); box-shadow: 0 0 0 3px var(--yellow), 0 0 0 7px var(--red), 0 14px 20px rgba(0,0,0,.45); }
.hand .card.new { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--sky), 0 6px 12px rgba(0,0,0,.35); }
.hand .card.sel.new { box-shadow: 0 0 0 3px var(--yellow), 0 0 0 7px var(--red), 0 14px 20px rgba(0,0,0,.45); }

/* ---------- Karten: bunt wie die Logo-Karten ----------
   Pik = Blau, Kreuz = Grün (schwarze Farben = kühle Töne)
   Herz = Rot, Karo = Gelb/Orange (rote Farben = warme Töne) */
.card {
  --c1: #f4f6fb; --c2: #d9e0f0; --c3: #4b5563;
  position: relative; width: var(--cw); height: calc(var(--cw) * 1.42); border-radius: calc(var(--cw) * .14);
  background:
    radial-gradient(120% 60% at 0% 0%, rgba(255,255,255,.35), transparent 55%),
    linear-gradient(155deg, var(--c1), var(--c2));
  color: var(--ink); border: calc(var(--cw) * .035 + 1px) solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 5px 0 rgba(0,0,0,.18), 0 8px 14px rgba(0,0,0,.25);
  font-family: var(--body); overflow: hidden; flex: none;
}
.card.s-S { --c1: #5b9bff; --c2: #1746c4; --c3: #0a2378; }
.card.s-C { --c1: #5be07c; --c2: #158a34; --c3: #0b4d1d; }
.card.s-H { --c1: #ff6b6b; --c2: #c8141f; --c3: #6e0b10; }
.card.s-D { --c1: #ffe066; --c2: #ff8a00; --c3: #9a3d00; }
.card::before { /* weißer Schwung in der Mitte */
  content: ''; position: absolute; left: 13%; right: 13%; top: 20%; bottom: 16%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff 55%, #eef2fb 100%);
  transform: rotate(-14deg); box-shadow: inset 0 calc(var(--cw) * -.04) 0 rgba(0,0,0,.08), 0 2px 0 rgba(0,0,0,.08);
}
.card::after { /* Glanzlinie wie auf den Logo-Karten */
  content: ''; position: absolute; left: -20%; right: -20%; top: 60%; height: 40%; border-radius: 50%;
  border-top: calc(var(--cw) * .03) solid rgba(255,255,255,.55); transform: rotate(-14deg); pointer-events: none;
}
.card .ci {
  position: absolute; z-index: 2; top: 3%; left: 7%; display: flex; flex-direction: column; align-items: center; line-height: .9;
  color: #fff;
  text-shadow: 1px 1px 0 var(--c3), -1px 1px 0 var(--c3), 1px -1px 0 var(--c3), -1px -1px 0 var(--c3), 0 calc(var(--cw) * .03 + 1px) 0 var(--c3);
}
.card .ci b { font-family: var(--display); font-weight: 400; font-size: calc(var(--cw) * .34); letter-spacing: -.02em; }
.card .ci i { font-style: normal; font-size: calc(var(--cw) * .22); margin-top: 1px; }
.card .ci.br { top: auto; left: auto; bottom: 3%; right: 7%; transform: rotate(180deg); }
.card .cs {
  position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding-top: 6%;
  font-size: calc(var(--cw) * .56); color: #18181b; filter: drop-shadow(0 2px 0 rgba(0,0,0,.12));
}
.card.red .cs { color: #e3262b; }
.card.joker {
  background:
    radial-gradient(120% 60% at 0% 0%, rgba(255,255,255,.35), transparent 55%),
    conic-gradient(from 210deg at 50% 50%, #2bb24c, #ffd23f, #ff9417, #e5262f, #8e44d9, #3fa9ff, #2bb24c);
  --c3: #6b1a8a;
}
.card.joker .jk { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; }
.card.joker .jk svg { width: 62%; height: auto; margin-top: -6%; filter: drop-shadow(0 2px 1px rgba(0,0,0,.2)); }
.card.joker .jk em {
  position: absolute; bottom: 6%; left: 0; right: 0; text-align: center; font-style: normal; font-family: var(--display);
  font-size: calc(var(--cw) * .17); color: #fff; letter-spacing: .05em;
  text-shadow: 1px 1px 0 var(--c3), -1px 1px 0 var(--c3), 1px -1px 0 var(--c3), -1px -1px 0 var(--c3);
}
.card.joker .ci b { color: var(--yellow); font-size: calc(var(--cw) * .28); }
.card.joker .rep {
  position: absolute; z-index: 2; bottom: 3%; right: 6%; font-size: calc(var(--cw) * .24); font-family: var(--display); color: #fff;
  text-shadow: 1px 1px 0 var(--c3), -1px 1px 0 var(--c3), 1px -1px 0 var(--c3), -1px -1px 0 var(--c3);
}
.card.empty { background: rgba(255,255,255,.06); border: 3px dashed rgba(255,255,255,.4); box-shadow: none; }
.card.empty::before, .card.empty::after { display: none; }
/* kleine Karten (Auslage) zeigen nur die Ecke */

/* ---------- Overlays ---------- */

}

.modal { position: fixed; inset: 0; background: rgba(4,14,58,.65); display: grid; place-items: center; z-index: 40; padding: 16px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

}

.sheet h2 {

  color: var(--yellow);

}

.tablewrap { overflow-x: auto; margin: 0 -6px; }

table.scores tr:last-child td { border-bottom: 0; }

@media (max-width: 520px) { table.scores { font-size: .8rem; } table.scores th, table.scores td { padding: 6px 3px; } }
.res { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }

.res .r.win { background: rgba(255,210,63,.22); border-color: var(--yellow); }

.knockprompt {

/* ===================== Layout v3: Hand groß in der Mitte, Stapel unten ===================== */
.main { min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 0; }

/* ---------- Sammelstapel ---------- */
.pilerow {
  --sw: clamp(40px, 10.5vw, 60px);
  display: flex; gap: 8px; overflow-x: auto; padding: 18px 2px 6px; flex: none; scrollbar-width: thin;
  border-bottom: 2px dashed rgba(255,255,255,.18);
}
.spile {
  position: relative; flex: none; display: flex; flex-direction: column; gap: 4px;
  padding: 6px 8px 8px; border-radius: 14px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.25);
  min-width: calc(var(--sw) + 20px);
}
.spile.ok { border-color: var(--green); background: rgba(43,178,76,.22); }
.spile.part { border-color: var(--yellow); background: rgba(255,210,63,.12); }
.spile.bad { border-color: #ff6b6b; background: rgba(229,38,47,.16); }
.spile.used { box-shadow: 0 0 0 3px rgba(43,178,76,.45), 0 0 16px rgba(43,178,76,.5); }
.splbl { font-size: .72rem; font-weight: 900; white-space: nowrap; cursor: pointer; padding-right: 18px; }
.spile.ok .splbl { color: #b7f5c6; }
.spile.part .splbl { color: var(--yellow-2); }
.spile.bad .splbl { color: #ffc2c2; }
.spcards { display: flex; }
.spcards .card { --cw: var(--sw); margin-right: calc(var(--sw) * -.55); touch-action: none; cursor: grab; transition: transform .12s; }
.spcards .card:last-child { margin-right: 0; }
.spcards .card .ci.br { display: none; }
.spcards .card .cs { font-size: calc(var(--cw) * .48); padding: 30% 0 0 28%; }
.spcards .card.sel { transform: translateY(-10px); box-shadow: 0 0 0 3px var(--yellow), 0 0 0 6px var(--red); }
.spcards .card.joker .jk { display: none; }
.spcards .card.dragging { z-index: 20; pointer-events: none; transition: none; }
.spx { position: absolute; top: -9px; right: -7px; width: 24px; height: 24px; border-radius: 50%; background: var(--red); border: 2px solid #fff; color: #fff; font-size: .7rem; font-weight: 900; }
.spile.new {
  align-items: center; justify-content: center; cursor: pointer; border-style: dashed; color: var(--muted);
  min-height: calc(var(--sw) * 1.42 + 30px); min-width: calc(var(--sw) * 1.2);
}
.spile.new span { font-family: var(--display); font-size: 1.6rem; color: var(--yellow); line-height: 1; }
.spile.new small { font-size: .66rem; font-weight: 800; text-align: center; max-width: 9em; line-height: 1.2; }
.spile.drop-on, .spile.new.drop-on { outline: 4px solid var(--yellow); outline-offset: 2px; }

/* ===================== Layout v4 ===================== */

.topbar .contract { flex: 1 1 0; min-width: 0; }

@media (min-width: 900px), (orientation: landscape) and (min-width: 640px) {

/* ===================== Kartenrückseite im Logo-Stil ===================== */
.back {
  position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 50% 46%, rgba(255,230,109,.55) 0 12%, transparent 46%),
    repeating-conic-gradient(from 0deg at 50% 46%, #ffb21f 0 8deg, #1f5fe8 8deg 20deg),
    #1746c4;
  border: calc(var(--cw) * .045 + 1px) solid #fff;
  outline: 2px solid #0a2378; outline-offset: 0;
}
.back::before { /* innerer gelber Rahmen + Sterne */
  content: ''; position: absolute; inset: 5%; border-radius: calc(var(--cw) * .1);
  border: 2px solid rgba(255,230,109,.9);
  background:
    radial-gradient(circle at 18% 14%, #fff 0 2px, transparent 3px),
    radial-gradient(circle at 84% 22%, #ffe66d 0 2.5px, transparent 3.5px),
    radial-gradient(circle at 14% 86%, #ffe66d 0 2px, transparent 3px),
    radial-gradient(circle at 86% 84%, #fff 0 2px, transparent 3px),
    radial-gradient(ellipse at 50% 46%, rgba(10,35,120,.0) 40%, rgba(10,35,120,.45) 100%);
  color: transparent; font-size: 0; text-shadow: none;

  position: absolute; left: 50%; top: 44%; width: 104%; max-width: none; height: auto;
  transform: translate(-50%, -50%) rotate(-10deg);
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
}

  position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); margin: 0;
  background: #0a2378; color: #fff; border: 2px solid #ffe66d; border-radius: 999px;
  padding: 0 .55em; font-size: calc(var(--cw) * .17); line-height: 1.35; text-shadow: none; z-index: 2;

  text-shadow:

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<script>
/* Skalamala – Spiel-Engine (läuft im Browser und in Node.js) */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Skalamala = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- Karten ----------
  const SUITS = ['S', 'H', 'D', 'C'];
  const SUIT_SYM = { S: '♠', H: '♥', D: '♦', C: '♣' };
  const SUIT_NAME = { S: 'Pik', H: 'Herz', D: 'Karo', C: 'Kreuz' };
  const RANK_LABEL = { 11: 'B', 12: 'D', 13: 'K', 14: 'A' };
  const isRed = (c) => c.suit === 'H' || c.suit === 'D';
  const rankLabel = (r) => RANK_LABEL[r] || String(r === 1 ? 'A' : r);
  const cardLabel = (c) => (c.joker ? 'Joker' : SUIT_SYM[c.suit] + rankLabel(c.rank));

  // Punkte: 2–9 = 5, 10–König = 10, Ass = 20, Joker = 50
  function cardPoints(c) {
    if (c.joker) return 50;
    if (c.rank === 14) return 20;
    if (c.rank >= 10) return 10;
    return 5;
  }
  const handPoints = (cards) => cards.reduce((s, c) => s + cardPoints(c), 0);

  function makeDeck() {
    // 2 Blätter à 55 Karten (52 + 3 Joker) = 110 Karten
    const deck = [];
    let id = 0;
    for (let d = 0; d < 2; d++) {
      for (const s of SUITS) for (let r = 2; r <= 14; r++) deck.push({ id: id++, suit: s, rank: r, joker: false });
      for (let j = 0; j < 3; j++) deck.push({ id: id++, suit: null, rank: 0, joker: true });
    }
    return deck;
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- Runden ----------
  // exact: beim ersten Auslegen genau so viele Karten (ohne „mind.“)
  const G = (min, exact) => ({ t: 'G', min, exact: !!exact });
  const S = (min, exact) => ({ t: 'S', min, exact: !!exact });
  const ROUNDS = [
    { n: 1, title: '1 Gruppe + 1 Sequenz', detail: 'Gruppe (3 Karten) und Sequenz (4 Karten)', slots: [G(3, 1), S(4, 1)], knock: true, fromHand: false },
    { n: 2, title: '3 Gruppen', detail: '3 Gruppen à 3 Karten', slots: [G(3, 1), G(3, 1), G(3, 1)], knock: true, fromHand: false },
    { n: 3, title: '2 Sequenzen', detail: '2 Sequenzen, mind. 4 Karten', slots: [S(4), S(4)], knock: true, fromHand: false },
    { n: 4, title: '2 Gruppen à 5', detail: '2 Gruppen à 5 Karten', slots: [G(5, 1), G(5, 1)], knock: true, fromHand: false },
    { n: 5, title: 'Skalamala', detail: '10er-Sequenz abwechselnd rot – schwarz', slots: [{ t: 'A', min: 10, exact: true }], knock: true, fromHand: false },
    { n: 6, title: '5 Gruppen à 2', detail: '5 Paare – OHNE KLOPFEN!', slots: [G(2, 1), G(2, 1), G(2, 1), G(2, 1), G(2, 1)], knock: false, fromHand: false },
    { n: 7, title: '2 Gruppen + 1 Sequenz', detail: 'aus der Hand ausmachen', slots: [G(3), G(3), S(4)], knock: true, fromHand: true },
    { n: 8, title: '1 Gruppe + 2 Sequenzen', detail: 'aus der Hand ausmachen – Finale!', slots: [G(3), S(4), S(4)], knock: true, fromHand: true },
  ];
  const TYPE_NAME = { G: 'Gruppe', S: 'Sequenz', A: 'Skalamala' };
  const slotLabel = (sl) => `${TYPE_NAME[sl.t]} (${sl.exact ? '' : 'mind. '}${sl.min})`;
  const fitsSlot = (cards, sl) => (!sl.exact || cards.length === sl.min) && !!validMeld(cards, sl.t, sl.min);

  // ---------- Kombinationen prüfen ----------
  // Ordnet eine Sequenz. alt=true: Farben abwechselnd rot/schwarz, beliebige Farben (Pik/Herz…)
  function arrangeRun(cards, alt) {
    const jokers = cards.filter((c) => c.joker);
    const nat = cards.filter((c) => !c.joker);
    // Joker sind beliebig einsetzbar – auch eine Sequenz nur aus Jokern ist erlaubt
    if (!nat.length) return cards.length <= 14 ? cards.map((c) => ({ card: c, rank: 0 })) : null;
    if (!alt && nat.some((c) => c.suit !== nat[0].suit)) return null;
    const aces = nat.filter((c) => c.rank === 14);
    if (aces.length > 2) return null;
    const combos = 1 << aces.length;
    for (let m = combos - 1; m >= 0; m--) {
      // Bit gesetzt = Ass hoch (14), sonst niedrig (1)
      const pos = new Map();
      let ok = true;
      for (const c of nat) {
        let p = c.rank;
        if (c.rank === 14) {
          const k = aces.indexOf(c);
          p = m & (1 << k) ? 14 : 1;
        }
        if (pos.has(p)) { ok = false; break; }
        pos.set(p, c);
      }
      if (!ok) continue;
      const ps = [...pos.keys()].sort((a, b) => a - b);
      if (alt) {
        const key = (p) => ((isRed(pos.get(p)) ? 1 : 0) + p) % 2;
        const k0 = key(ps[0]);
        if (ps.some((p) => key(p) !== k0)) continue;
      }
      let lo = ps[0], hi = ps[ps.length - 1];
      const gaps = hi - lo + 1 - ps.length;
      if (gaps > jokers.length) continue;
      let extra = jokers.length - gaps;
      while (extra > 0 && hi < 14) { hi++; extra--; }
      while (extra > 0 && lo > 1) { lo--; extra--; }
      if (extra > 0) continue;
      const out = [];
      let ji = 0;
      for (let p = lo; p <= hi; p++) {
        if (pos.has(p)) out.push({ card: pos.get(p), rank: p });
        else out.push({ card: jokers[ji++], rank: p });
      }
      return out;
    }
    return null;
  }

  function validMeld(cards, t, min) {
    min = min || 0;
    if (cards.length < Math.max(min, 1)) return null;
    if (t === 'G') {
      const nat = cards.filter((c) => !c.joker);
      if (nat.some((c) => c.rank !== nat[0].rank)) return null;
      const r = nat.length ? nat[0].rank : 0; // nur Joker: Wert noch offen
      return nat.concat(cards.filter((c) => c.joker)).map((c) => ({ card: c, rank: r }));
    }
    if (t === 'S' || t === 'A') return arrangeRun(cards, t === 'A');
    return null;
  }

  // Ordnet Kombinationen den Vorgaben der Runde zu (Reihenfolge egal)
  function matchContract(meldCards, slots) {
    if (meldCards.length !== slots.length) return null;
    const used = new Array(slots.length).fill(false);
    const res = new Array(meldCards.length);
    function bt(i) {
      if (i === meldCards.length) return true;
      for (let k = 0; k < slots.length; k++) {
        if (used[k]) continue;
        if (fitsSlot(meldCards[i], slots[k])) {
          used[k] = true; res[i] = slots[k].t;
          if (bt(i + 1)) return true;
          used[k] = false;
        }
      }
      return false;
    }
    return bt(0) ? res : null;
  }

  // ---------- Spielzustand ----------
  function newGame(players, opts) {
    const s = {
      players: players.map((p) => ({ name: p.name, bot: !!p.bot, hand: [], down: false, scores: [], total: 0 })),
      round: -1,
      dealer: Math.floor(Math.random() * players.length),
      phase: 'init',
      current: 0,
      stock: [], discard: [], discardBy: null,
      melds: [], meldSeq: 0,
      knock: null,
      log: [], seq: 0,
      lastRound: null,
      opts: Object.assign({ knockMs: 7000 }, opts || {}),
    };
    startRound(s);
    return s;
  }

  function log(s, msg) {
    s.log.push({ t: Date.now(), msg });
    if (s.log.length > 80) s.log.splice(0, s.log.length - 80);
  }

  function startRound(s) {
    s.round++;
    if (s.round > 0) s.dealer = (s.dealer + 1) % s.players.length;
    const deck = shuffle(makeDeck());
    s.players.forEach((p) => { p.hand = []; p.down = false; p.downTurn = -1; });
    const n = s.players.length;
    for (let k = 0; k < 11; k++) for (let i = 1; i <= n; i++) s.players[(s.dealer + i) % n].hand.push(deck.pop());
    s.stock = deck;
    s.discard = [s.stock.pop()];
    s.discardBy = null;
    s.reshuffles = 0;
    s.turn = 0;
    s.taken = {};
    s.melds = [];
    s.current = (s.dealer + 1) % n;
    s.phase = 'draw';
    s.knock = { responses: {}, deadline: 0, order: [] };
    s.lastRound = null;
    log(s, `Runde ${s.round + 1}: ${ROUNDS[s.round].title} – ${s.players[s.dealer].name} gibt, ${s.players[s.current].name} beginnt.`);
    s.seq++;
  }

  function drawFromStock(s) {
    if (!s.stock.length) {
      // Der Stapel wird höchstens einmal pro Runde neu gemischt
      if (s.discard.length <= 1 || s.reshuffles >= 1) return null;
      s.reshuffles++;
      const top = s.discard.pop();
      s.stock = shuffle(s.discard);
      s.discard = [top];
      log(s, 'Der Stapel ist leer – die Ablage wird neu gemischt (letztes Mal in dieser Runde).');
    }
    return s.stock.pop() || null;
  }
  const available = (s) => s.stock.length + (s.reshuffles ? 0 : Math.max(0, s.discard.length - 1));

  // Darf seat jetzt klopfen?
  function canKnock(s, seat) {
    if (seat == null || seat === s.current) return false;
    if (s.phase !== 'draw' && s.phase !== 'knock') return false;
    if (!ROUNDS[s.round].knock) return false;
    const p = s.players[seat];
    if (!p || p.down) return false;
    if (!s.discard.length || seat === s.discardBy) return false;
    if (available(s) < 2) return false;
    return true;
  }
  const knockEligible = (s) => s.players.map((_, i) => i).filter((i) => canKnock(s, i));
  function knockOrder(s) {
    const n = s.players.length, out = [];
    for (let k = 1; k < n; k++) out.push((s.current + k) % n);
    return out;
  }
  function knockPending(s) {
    return knockEligible(s).filter((i) => s.knock.responses[i] === undefined);
  }
  // Wer zuerst klopft, bekommt die Karte (der Spieler am Zug hat aber immer Vorrang).
  // Entschieden ist es, sobald jemand geklopft hat oder alle gepasst haben.
  function firstKnocker(s) {
    const elig = new Set(knockEligible(s));
    return (s.knock.order || []).find((i) => elig.has(i));
  }
  function knockDecided(s) {
    if (firstKnocker(s) !== undefined) return true;
    return knockPending(s).length === 0;
  }

  function resolveKnock(s) {
    const winner = firstKnocker(s);
    if (winner !== undefined) {
      const p = s.players[winner];
      const c = s.discard.pop();
      p.hand.push(c);
      const pen = drawFromStock(s);
      if (pen) p.hand.push(pen);
      log(s, `👊 ${p.name} klopft und nimmt ${cardLabel(c)} + 1 verdeckte Karte.`);
    }
    const c = drawFromStock(s);
    s.knock = { responses: {}, deadline: 0, order: [] };
    if (!c) return endRound(s, null);
    s.players[s.current].hand.push(c);
    s.phase = 'play';
    s.lastDrawn = c.id;
    log(s, `${s.players[s.current].name} zieht vom Stapel.`);
  }

  function endRound(s, winner) {
    const pts = s.players.map((p, i) => (i === winner ? 0 : handPoints(p.hand)));
    s.players.forEach((p, i) => { p.scores.push(pts[i]); p.total += pts[i]; });
    s.lastRound = {
      round: s.round, winner,
      points: pts,
      hands: s.players.map((p) => p.hand.slice()),
    };
    if (winner != null) log(s, `🎉 ${s.players[winner].name} macht aus!`);
    else log(s, 'Der Stapel ist aufgebraucht – Runde beendet, alle zählen ihre Handkarten.');
    s.phase = s.round >= ROUNDS.length - 1 ? 'gameEnd' : 'roundEnd';
  }

  function nextTurn(s) {
    s.current = (s.current + 1) % s.players.length;
    s.turn = (s.turn || 0) + 1;
    s.phase = 'draw';
    s.knock = { responses: {}, deadline: 0, order: [] };
    s.lastDrawn = null;
    s.lastTaken = null;
  }

  function takeFromHand(p, ids) {
    const cards = [];
    for (const id of ids) {
      const c = p.hand.find((h) => h.id === id);
      if (!c || cards.includes(c)) return null;
      cards.push(c);
    }
    return cards;
  }
  const removeFromHand = (p, cards) => { p.hand = p.hand.filter((c) => !cards.includes(c)); };

  // ---------- Aktionen ----------
  // gibt null (ok) oder eine Fehlermeldung zurück
  function act(s, seat, a) {
    const r = _act(s, seat, a);
    if (!r) s.seq++;
    return r;
  }
  function _act(s, seat, a) {
    if (!a || !a.type) return 'Ungültige Aktion';
    const R = ROUNDS[s.round];
    const p = seat != null ? s.players[seat] : null;

    if (a.type === 'nextRound') {
      if (s.phase !== 'roundEnd') return 'Runde läuft noch';
      startRound(s);
      return null;
    }
    if (a.type === 'knockTimeout') {
      if (s.phase !== 'knock') return 'Kein Klopfen offen';
      for (const i of knockPending(s)) s.knock.responses[i] = 'pass';
      resolveKnock(s);
      return null;
    }
    if (a.type === 'knock' || a.type === 'pass') {
      if (seat == null || !p) return 'Ungültiger Spieler';
      if (a.type === 'knock' && !canKnock(s, seat)) return 'Klopfen ist gerade nicht möglich';
      if (a.type === 'pass' && (s.phase !== 'draw' && s.phase !== 'knock')) return 'Nichts zu passen';
      if (s.knock.responses[seat] !== undefined) return 'Du hast schon entschieden';
      s.knock.responses[seat] = a.type;
      if (a.type === 'knock') {
        s.knock.order = s.knock.order || [];
        s.knock.order.push(seat);
        log(s, s.knock.order.length === 1 ? `👊 ${p.name} klopft als Erste(r)!` : `👊 ${p.name} klopft – zu spät.`);
      }
      if (s.phase === 'knock' && knockDecided(s)) resolveKnock(s);
      return null;
    }

    if (seat !== s.current) return 'Du bist nicht dran';

    if (s.phase === 'draw') {
      if (a.type === 'takeDiscard') {
        if (!s.discard.length) return 'Die Ablage ist leer';
        const c = s.discard.pop();
        p.hand.push(c);
        s.lastDrawn = c.id;
        s.lastTaken = c.id;
        s.taken[c.id] = (s.taken[c.id] || 0) + 1;
        s.knock = { responses: {}, deadline: 0, order: [] };
        s.phase = 'play';
        log(s, `${p.name} nimmt ${cardLabel(c)} von der Ablage.`);
        return null;
      }
      if (a.type === 'drawStock') {
        if (R.knock && knockEligible(s).length) {
          s.phase = 'knock';
          s.knock.deadline = Date.now() + s.opts.knockMs;
          if (knockDecided(s)) resolveKnock(s);
          return null;
        }
        const c = drawFromStock(s);
        if (!c) { endRound(s, null); return null; }
        p.hand.push(c);
        s.lastDrawn = c.id;
        s.phase = 'play';
        log(s, `${p.name} zieht vom Stapel.`);
        return null;
      }
      return 'Zuerst eine Karte ziehen';
    }

    if (s.phase !== 'play') return 'Gerade nicht möglich';

    if (a.type === 'layDown') {
      if (p.down) return 'Du hast schon ausgelegt';
      if (!Array.isArray(a.melds)) return 'Ungültig';
      if (a.melds.length !== R.slots.length) return `In dieser Runde werden genau ${R.slots.length} Kombination${R.slots.length === 1 ? '' : 'en'} ausgelegt: ${R.slots.map(slotLabel).join(' + ')}. Weitere Karten danach anlegen.`;
      const all = [].concat(...a.melds);
      const cards = takeFromHand(p, all);
      if (!cards) return 'Karten nicht auf der Hand';
      const meldCards = a.melds.map((ids) => ids.map((id) => cards.find((c) => c.id === id)));
      const types = matchContract(meldCards, R.slots);
      if (!types) return `Beim Auslegen genau die Vorgabe: ${R.slots.map(slotLabel).join(' + ')}. Weitere Karten danach anlegen – bei Gegenspielern sofort, bei dir erst im nächsten Zug.`;
      const left = p.hand.length - cards.length;
      if (R.fromHand && left > 1) return 'In dieser Runde muss komplett aus der Hand ausgemacht werden (höchstens 1 Karte zum Abwerfen übrig).';
      removeFromHand(p, cards);
      meldCards.forEach((mc, i) => {
        const arr = validMeld(mc, types[i]);
        s.melds.push({ id: ++s.meldSeq, owner: seat, t: types[i], cards: arr.map((x) => x.card), ranks: arr.map((x) => x.rank) });
      });
      p.down = true;
      p.downTurn = s.turn;
      log(s, `${p.name} legt aus: ${types.map((t) => TYPE_NAME[t]).join(', ')}.`);
      if (R.fromHand) {
        if (p.hand.length === 1) {
          const c = p.hand.pop();
          s.discard.push(c); s.discardBy = seat;
          log(s, `${p.name} wirft ${cardLabel(c)} ab.`);
        }
        endRound(s, seat);
        return null;
      }
      if (!p.hand.length) endRound(s, seat);
      return null;
    }

    if (a.type === 'layOff') {
      if (!p.down) return 'Erst die Vorgabe auslegen, dann anlegen';
      const m = s.melds.find((x) => x.id === a.meldId);
      if (!m) return 'Kombination nicht gefunden';
      if (m.owner === seat && p.downTurn === s.turn) return 'An deine eigenen Kombinationen darfst du erst ab deinem nächsten Zug anlegen – an die der Gegenspieler sofort.';
      const ids = a.cardIds || (a.cardId != null ? [a.cardId] : []);
      const cards = takeFromHand(p, ids);
      if (!cards || !cards.length) return 'Karten nicht auf der Hand';
      const arr = validMeld(m.cards.concat(cards), m.t);
      if (!arr) return 'Passt nicht an diese Kombination';
      removeFromHand(p, cards);
      m.cards = arr.map((x) => x.card);
      m.ranks = arr.map((x) => x.rank);
      log(s, `${p.name} legt ${cards.map(cardLabel).join(' ')} an.`);
      if (!p.hand.length) endRound(s, seat);
      return null;
    }

    if (a.type === 'discard') {
      const c = p.hand.find((h) => h.id === a.cardId);
      if (!c) return 'Karte nicht auf der Hand';
      removeFromHand(p, [c]);
      s.discard.push(c);
      s.discardBy = seat;
      log(s, `${p.name} wirft ${cardLabel(c)} ab.`);
      if (!p.hand.length) { endRound(s, seat); return null; }
      nextTurn(s);
      return null;
    }
    return 'Unbekannte Aktion';
  }

  // Sicht eines Spielers (versteckt fremde Karten)
  function view(s, seat) {
    const reveal = s.phase === 'roundEnd' || s.phase === 'gameEnd';
    return {
      seat,
      round: s.round,
      roundInfo: ROUNDS[s.round],
      phase: s.phase,
      current: s.current,
      dealer: s.dealer,
      players: s.players.map((p) => ({ name: p.name, bot: p.bot, down: p.down, handCount: p.hand.length, total: p.total, scores: p.scores.slice() })),
      hand: seat != null && s.players[seat] ? s.players[seat].hand.slice() : [],
      melds: s.melds.map((m) => ({ id: m.id, owner: m.owner, t: m.t, cards: m.cards.slice(), ranks: m.ranks.slice() })),
      discardTop: s.discard.length ? s.discard[s.discard.length - 1] : null,
      discardCount: s.discard.length,
      discardBy: s.discardBy,
      stockCount: s.stock.length,
      reshuffles: s.reshuffles,
      lastDrawn: seat === s.current ? s.lastDrawn : null,
      ownLocked: seat != null && s.players[seat] ? (s.players[seat].down && s.players[seat].downTurn === s.turn) : false,
      knock: {
        responses: Object.assign({}, s.knock.responses),
        first: firstKnocker(s),
        deadline: s.knock.deadline,
        canKnock: canKnock(s, seat),
        pending: s.phase === 'knock' ? knockPending(s) : [],
      },
      log: s.log.slice(-25),
      // Am Rundenende nur Punkte zeigen – fremde Karten bleiben verdeckt, nur die eigenen Restkarten sind sichtbar
      lastRound: reveal && s.lastRound ? {
        round: s.lastRound.round, winner: s.lastRound.winner, points: s.lastRound.points.slice(),
        hands: s.lastRound.hands.map((h, i) => (i === seat ? h.slice() : [])),
        counts: s.lastRound.hands.map((h) => h.length),
      } : null,
      seq: s.seq,
    };
  }

  // ---------- Bot ----------
  function dist(a, b) {
    // Abstand zweier Ränge, Ass zählt als 1 oder 14
    const ra = a === 14 ? [1, 14] : [a], rb = b === 14 ? [1, 14] : [b];
    let d = 99;
    for (const x of ra) for (const y of rb) d = Math.min(d, Math.abs(x - y));
    return d;
  }
  function usefulness(c, others, R) {
    if (c.joker) return 100;
    const types = new Set(R.slots.map((x) => x.t));
    let u = 0;
    if (types.has('G')) {
      const same = others.filter((o) => !o.joker && o.rank === c.rank).length;
      const pairs = R.slots.every((x) => x.min === 2);
      if (same) u += pairs ? 7 : same === 1 ? 3.5 : 5 + same;
    }
    if (types.has('S')) {
      const seen = new Set();
      for (const o of others) {
        if (o.joker || o.suit !== c.suit || seen.has(o.rank)) continue;
        const d = dist(c.rank, o.rank);
        if (d >= 1 && d <= 3) { u += 4 - d; seen.add(o.rank); }
      }
    }
    if (types.has('A')) {
      const seen = new Set();
      for (const o of others) {
        if (o.joker || seen.has(o.rank)) continue;
        const d = dist(c.rank, o.rank);
        if (d >= 1 && d <= 4 && (isRed(c) !== isRed(o)) === (d % 2 === 1)) { u += (5 - d) * 0.8; seen.add(o.rank); }
      }
    }
    return u;
  }

  function candidates(cards, slot) {
    const jokers = cards.filter((c) => c.joker);
    const nat = cards.filter((c) => !c.joker);
    const out = [];
    if (slot.t === 'G') {
      const by = {};
      for (const c of nat) (by[c.rank] = by[c.rank] || []).push(c);
      for (const r in by) {
        const arr = by[r];
        const t = Math.min(arr.length, slot.min);
        const need = slot.min - t;
        if (need <= jokers.length) out.push({ cards: arr.slice(0, t).concat(jokers.slice(0, need)), cost: need, val: +r });
      }
    } else {
      const span = slot.min;
      const variants = slot.t === 'S' ? SUITS.map((su) => ({ su })) : [{ par: 0 }, { par: 1 }];
      for (const v of variants) {
        for (let lo = 1; lo + span - 1 <= 14; lo++) {
          const chosen = [];
          let missing = 0;
          for (let p = lo; p < lo + span; p++) {
            const rk = p === 1 ? 14 : p;
            const c = nat.find((x) => x.rank === rk && !chosen.includes(x) &&
              (slot.t === 'S' ? x.suit === v.su : (isRed(x) ? 1 : 0) === (p + v.par) % 2));
            if (c) chosen.push(c); else missing++;
          }
          if (missing <= jokers.length && chosen.length) out.push({ cards: chosen.concat(jokers.slice(0, missing)), cost: missing, val: lo });
        }
      }
    }
    out.sort((a, b) => a.cost - b.cost || b.val - a.val);
    return out.slice(0, 30);
  }

  // Sucht eine Auslage für die Vorgabe. extend=true: Restkarten werden noch angelegt.
  function findContract(hand, R, extend, maxNodes) {
    maxNodes = maxNodes || 4000;
    const order = R.slots.map((sl, i) => ({ sl, i })).sort((a, b) => {
      const w = (x) => (x.sl.t === 'A' ? 0 : x.sl.t === 'S' ? 1 : 2);
      return w(a) - w(b) || b.sl.min - a.sl.min;
    });
    let best = null, nodes = 0;
    function finish(acc, rem) {
      let melds = acc.map((m) => ({ t: m.t, cards: m.cards.slice() }));
      let left = rem.slice();
      if (extend) {
        let changed = true;
        while (changed) {
          changed = false;
          for (const c of left.slice()) {
            for (const m of melds) {
              if (validMeld(m.cards.concat([c]), m.t)) { m.cards.push(c); left = left.filter((x) => x !== c); changed = true; break; }
            }
          }
        }
      }
      const score = left.length * 1000 + handPoints(left);
      if (!best || score < best.score) best = { score, melds, left };
    }
    function bt(k, rem, acc) {
      if (++nodes > maxNodes) return;
      if (best && !extend) return;
      if (best && best.left.length === 0) return;
      if (k === order.length) return finish(acc, rem);
      const sl = order[k].sl;
      for (const cand of candidates(rem, sl)) {
        bt(k + 1, rem.filter((c) => !cand.cards.includes(c)), acc.concat([{ t: sl.t, cards: cand.cards }]));
        if (nodes > maxNodes) return;
      }
    }
    bt(0, hand.slice(), []);
    return best;
  }

  // Wie weit ist die Hand von der Vorgabe entfernt? (kleiner = besser)
  const VJ = [0, 1, 2, 3].map((k) => ({ id: -100 - k, suit: null, rank: 0, joker: true, virtual: true }));
  function progress(hand, R) {
    for (let k = 0; k <= 3; k++) {
      const f = findContract(hand.concat(VJ.slice(0, k)), R, true, 1200);
      if (f) {
        const left = f.left.filter((c) => !c.virtual);
        return k * 20 + left.length * 3 + handPoints(left) / 60;
      }
    }
    return 80 - Math.min(10, hand.reduce((t, c) => t + usefulness(c, hand.filter((x) => x !== c), R), 0) / 10);
  }
  function bestDiscard(hand, R, lastDrawn, avoid) {
    let best = null, bestScore = Infinity;
    for (const c of hand) {
      if (c.id === avoid && hand.length > 1) continue;
      if (c.joker && hand.some((x) => !x.joker)) continue;
      const sc = progress(hand.filter((x) => x !== c), R) - cardPoints(c) / 200 + (c.id === lastDrawn ? 0.01 : 0);
      if (sc < bestScore) { bestScore = sc; best = c; }
    }
    return { card: best || hand[0], score: bestScore };
  }

  function canLayOffAny(s, c, seat) {
    const p = seat != null ? s.players[seat] : null;
    const locked = p && p.downTurn === s.turn;
    return s.melds.find((m) => !(locked && m.owner === seat) && validMeld(m.cards.concat([c]), m.t));
  }

  function botAction(s, seat) {
    const R = ROUNDS[s.round];
    const p = s.players[seat];
    if (s.phase === 'knock') {
      if (!knockPending(s).includes(seat)) return null;
      const c = s.discard[s.discard.length - 1];
      let want = false;
      // In "aus der Hand"-Runden macht jede Strafkarte das Ausmachen schwerer
      const maxHand = R.fromHand ? 11 : 13;
      if (c && !p.down && p.hand.length <= maxHand) {
        if (c.joker) want = true;
        else if (R.fromHand) {
          const f = findContract(p.hand.concat([c]), R, true);
          want = !!(f && f.left.length <= 2);
        } else {
          const u = usefulness(c, p.hand, R);
          if (u >= 6) want = true;
        }
      }
      return { type: want ? 'knock' : 'pass' };
    }
    if (seat !== s.current) return null;
    if (s.phase === 'draw') {
      const c = s.discard[s.discard.length - 1];
      if (!c) return { type: 'drawStock' };
      if ((s.taken[c.id] || 0) >= 2) return { type: 'drawStock' };
      if (c.joker) return { type: 'takeDiscard' };
      if (p.down) return canLayOffAny(s, c, seat) ? { type: 'takeDiscard' } : { type: 'drawStock' };
      const before = findContract(p.hand, R, R.fromHand);
      const okBefore = before && (!R.fromHand || before.left.length <= 1);
      if (!okBefore) {
        const after = findContract(p.hand.concat([c]), R, R.fromHand);
        if (after && (!R.fromHand || after.left.length <= 1)) return { type: 'takeDiscard' };
      }
      if (R.fromHand || R.slots[0].t === 'A') {
        const now = progress(p.hand, R);
        const withC = bestDiscard(p.hand.concat([c]), R).score;
        return withC < now - 0.5 ? { type: 'takeDiscard' } : { type: 'drawStock' };
      }
      const uNew = usefulness(c, p.hand, R);
      const minU = Math.min(...p.hand.map((h) => usefulness(h, p.hand.filter((x) => x !== h), R)));
      if (uNew >= 3 && uNew > minU + 1) return { type: 'takeDiscard' };
      return { type: 'drawStock' };
    }
    if (s.phase === 'play') {
      if (!p.down) {
        const f = findContract(p.hand, R, R.fromHand);
        if (f && (!R.fromHand || f.left.length <= 1)) return { type: 'layDown', melds: f.melds.map((m) => m.cards.map((c) => c.id)) };
      } else {
        for (const c of p.hand) {
          const m = canLayOffAny(s, c, seat);
          if (m) return { type: 'layOff', cardIds: [c.id], meldId: m.id };
        }
      }
      // Abwerfen
      if (!p.down && (R.fromHand || R.slots[0].t === 'A')) return { type: 'discard', cardId: bestDiscard(p.hand, R, s.lastDrawn, s.lastTaken).card.id };
      let best = null, bestKey = Infinity;
      for (const c of p.hand) {
        if (c.joker && p.hand.some((x) => !x.joker)) continue;
        if (c.id === s.lastTaken && p.hand.length > 1) continue;
        const key = p.down ? -cardPoints(c) : usefulness(c, p.hand.filter((x) => x !== c), R) - cardPoints(c) / 25 + (c.id === s.lastDrawn ? 0.5 : 0);
        if (key < bestKey) { bestKey = key; best = c; }
      }
      return { type: 'discard', cardId: (best || p.hand[0]).id };
    }
    return null;
  }

  // ---------- Spielleitung mit Timern (Browser & Server) ----------
  class GameHost {
    constructor(players, opts) {
      this.opts = Object.assign({ botDelay: 900, knockMs: 7000, onChange: () => {}, isAuto: null }, opts || {});
      this.s = newGame(players, { knockMs: this.opts.knockMs });
      this.timers = [];
      this._tick();
    }
    isAuto(seat) { return this.opts.isAuto ? this.opts.isAuto(seat, this.s) : this.s.players[seat].bot; }
    view(seat) { return view(this.s, seat); }
    act(seat, a) {
      const err = act(this.s, seat, a);
      if (!err) { this.opts.onChange(); this._tick(); }
      return err;
    }
    _clear() { this.timers.forEach(clearTimeout); this.timers = []; }
    _later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
    refresh() { this._tick(); }
    destroy() { this._clear(); this.dead = true; }
    _tick() {
      this._clear();
      if (this.dead) return;
      const s = this.s, seq = s.seq;
      if (s.phase === 'knock') {
        const pend = knockPending(s);
        const autos = pend.filter((i) => this.isAuto(i));
        const left = Math.max(200, s.knock.deadline - Date.now() - 400);
        for (const i of autos) {
          // Bots überlegen kurz – so haben Menschen eine faire Chance, zuerst zu klopfen
          const a = botAction(s, i) || { type: 'pass' };
          const d = a.type === 'knock' ? 900 + Math.random() * 1800 : 300 + Math.random() * 600;
          this._later(Math.min(d, left), () => {
            if (s.phase !== 'knock' || s.knock.responses[i] !== undefined) return;
            if (!act(s, i, a)) { this.opts.onChange(); this._tick(); }
          });
        }
        const ms = Math.max(0, s.knock.deadline - Date.now());
        this._later(ms + 50, () => { if (s.seq === seq && s.phase === 'knock') this.act(null, { type: 'knockTimeout' }); });
        return;
      }
      if ((s.phase === 'draw' || s.phase === 'play') && this.isAuto(s.current)) {
        const delay = s.phase === 'draw' ? this.opts.botDelay * 1.2 : this.opts.botDelay;
        this._later(delay, () => {
          if (s.seq !== seq) return;
          const cur = s.current;
          let a = botAction(s, cur);
          let err = a ? act(s, cur, a) : 'none';
          if (err) {
            // Sicherheitsnetz: niemals hängen bleiben
            if (s.phase === 'draw') err = act(s, cur, { type: 'drawStock' });
            else if (s.phase === 'play') err = act(s, cur, { type: 'discard', cardId: s.players[cur].hand[0].id });
          }
          this.opts.onChange(); this._tick();
        });
      }
    }
  }

  return {
    SUITS, SUIT_SYM, SUIT_NAME, ROUNDS, TYPE_NAME, isRed, rankLabel, cardLabel, cardPoints, handPoints,
    validMeld, matchContract, slotLabel, fitsSlot, newGame, act, view, botAction, findContract, GameHost, canKnock,
  };
});

  const avatar = (name, i, extra) => `<span class="av ${extra && extra.off ? 'off' : ''}" style="--c:${COLORS[i % COLORS.length]}">${esc(String(name).replace(/[^\p{L}\p{N}]/gu, '').charAt(0).toUpperCase() || '?')}${extra && extra.cnt != null ? `<span class="cnt">${extra.cnt}</span>` : ''}</span>`;
  // Narrenkappe für den Joker (eigene Zeichnung)
  const JESTER = '<svg viewBox="0 0 100 90" aria-hidden="true"><path d="M14 72 C20 48 30 30 50 22 C70 30 80 48 86 72 Z" fill="#e5262f"/><path d="M14 72 C10 48 4 34 6 20 C22 30 34 44 40 60 Z" fill="#ffd23f"/><path d="M86 72 C90 48 96 34 94 20 C78 30 66 44 60 60 Z" fill="#2f6fe8"/><path d="M40 60 C44 40 47 24 50 8 C53 24 56 40 60 60 Z" fill="#ff9417"/><rect x="10" y="68" width="80" height="14" rx="7" fill="#ffd23f" stroke="#b84a00" stroke-width="2"/><circle cx="6" cy="18" r="7" fill="#ffd23f" stroke="#b84a00" stroke-width="2"/><circle cx="94" cy="18" r="7" fill="#ffd23f" stroke="#b84a00" stroke-width="2"/><circle cx="50" cy="7" r="7" fill="#ffd23f" stroke="#b84a00" stroke-width="2"/></svg>';
  const $app = document.getElementById('app');

  // ---------- Hilfen ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('skalamala_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('skalamala_' + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem('skalamala_' + k); } catch (e) {} },
  };
  let toastTimer;
  function toast(msg, ms) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), ms || 2600);

  function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
  function openModal(html, onClick) {
    $modal.innerHTML = `<div class="sheet">${html}</div>`;
    $modal.classList.remove('hidden');

  function cardHTML(c, opts) {
    opts = opts || {};
    const cls = opts.cls || '';
    if (!c) return `<div class="card empty ${cls}"></div>`;
    const data = `data-id="${c.id}"`;
    if (c.joker) {
      const rep = opts.rep ? `<span class="rep">${E.rankLabel(opts.rep)}</span>` : '';
      return `<div class="card joker ${cls}" ${data} aria-label="Joker"><span class="ci"><b>★</b></span><span class="jk">${JESTER}<em>JOKER</em></span>${rep}${opts.badge ? '<span class="newbadge">NEU</span>' : ''}</div>`;
    }
    const r = E.rankLabel(c.rank), s = E.SUIT_SYM[c.suit];
    const badge = opts.badge ? '<span class="newbadge">NEU</span>' : '';
    return `<div class="card s-${c.suit} ${E.isRed(c) ? 'red' : 'black'} ${cls}" ${data} aria-label="${E.SUIT_NAME[c.suit]} ${r}"><span class="ci"><b>${r}</b><i>${s}</i></span><span class="cs">${s}</span><span class="ci br"><b>${r}</b><i>${s}</i></span>${badge}</div>`;
  }

  const SUIT_ORDER = { S: 0, H: 1, C: 2, D: 3 };
  function sortHand(hand, mode) {
    return hand.slice().sort((a, b) => {
      if (a.joker !== b.joker) return a.joker ? 1 : -1;
      if (a.joker) return a.id - b.id;
      if (mode === 'rank') return a.rank - b.rank || SUIT_ORDER[a.suit] - SUIT_ORDER[b.suit] || a.id - b.id;
      return SUIT_ORDER[a.suit] - SUIT_ORDER[b.suit] || a.rank - b.rank || a.id - b.id;
    });
  }

  // Eigene Reihenfolge (per Ziehen) oder automatisch sortiert
  function orderedHand(cards, round) {
    if (ui.sort === 'custom' && ui.orderRound !== round) { ui.sort = store.get('sort', 'suit'); }
    if (ui.sort !== 'custom') return sortHand(cards, ui.sort);
    const pos = new Map(ui.order.map((id, i) => [id, i]));
    const key = (c) => (pos.has(c.id) ? pos.get(c.id) : 1e6 + c.id);
    return cards.slice().sort((a, b) => key(a) - key(b));
  }

  // ---------- Sammelstapel ----------
  function movePileCards(ids, target) {
    ui.piles = ui.piles.map((p) => p.filter((id) => !ids.includes(id)));
    if (target === 'new') ui.piles.push(ids.slice());
    else if (target != null && ui.piles[target]) ui.piles[target] = ui.piles[target].concat(ids);
    // leere Stapel entfernen – Indizes vorher merken ist nicht nötig, da Ziel schon befüllt ist
    ui.piles = ui.piles.filter((p) => p.length);
  }
  function pileStatus(cards, R) {
    const n = cards.length;
    if (n === 1) return { cls: 'part', label: 'Stapel (1)' };
    for (const sl of R.slots) if (E.fitsSlot(cards, sl)) return { cls: 'ok', label: `✓ ${E.TYPE_NAME[sl.t]}` };
    for (const sl of R.slots) if (sl.exact && n > sl.min && E.validMeld(cards, sl.t, sl.min)) return { cls: 'bad', label: `${E.TYPE_NAME[sl.t]}: nur ${sl.min} Karten!` };
    const types = [...new Set(R.slots.map((x) => x.t))];
    for (const t of types) {
      if (E.validMeld(cards, t)) {
        const min = Math.min(...R.slots.filter((x) => x.t === t).map((x) => x.min));
        return { cls: 'part', label: `${E.TYPE_NAME[t]} – noch ${min - n}` };
      }
    }
    // gültig, aber nicht gesucht (z. B. Sequenz in einer Gruppen-Runde): nur zum Sammeln
    if (E.validMeld(cards, 'G') || E.validMeld(cards, 'S')) return { cls: 'part', label: `Stapel (${n})` };
    return { cls: 'bad', label: n === 1 ? 'Stapel (1)' : 'passt nicht' };
  }
  // Ergeben die ausgewählten Karten (zusammen mit gültigen Stapeln) die Vorgabe? Dann automatisch aufteilen.
  function contractFromSelection(v) {
    const R = v.roundInfo;
    const byId = new Map(v.hand.map((c) => [c.id, c]));
    const pileIds = new Set([].concat(...ui.piles));
    const cards = [...new Set(ui.selected.concat(...ui.piles))].map((id) => byId.get(id)).filter(Boolean);
    if (cards.length < R.slots.reduce((t, x) => t + x.min, 0)) return null;
    const f = E.findContract(cards, R, R.slots.some((x) => !x.exact), 8000);
    if (!f || f.left.length) return null;
    if (!E.matchContract(f.melds.map((m) => m.cards), R.slots)) return null;
    return { used: [], auto: true, melds: f.melds.map((m) => m.cards.map((c) => c.id)) };
  }

  // Welche Sammelstapel ergeben zusammen die Vorgabe der Runde?
  function contractFromPiles(v) {
    const R = v.roundInfo, k = R.slots.length;
    const byId = new Map(v.hand.map((c) => [c.id, c]));
    const piles = ui.piles.map((p) => p.map((id) => byId.get(id)).filter(Boolean));
    const idx = piles.map((_, i) => i);
    let found = null;
    (function choose(start, acc) {
      if (found) return;
      if (acc.length === k) {
        if (E.matchContract(acc.map((i) => piles[i]), R.slots)) found = acc.slice();
        return;
      }
      for (let i = start; i < idx.length; i++) { acc.push(i); choose(i + 1, acc); acc.pop(); }
    })(0, []);
    if (!found) return null;
    return { used: found, melds: found.map((i) => piles[i].map((c) => c.id)) };
  }

  // Passen die (vorgemerkten) Kombinationen auf verschiedene Vorgaben?
  function partialMatch(melds, slots) {
    if (melds.length > slots.length) return false;
    const used = slots.map(() => false);
    const bt = (i) => {
      if (i === melds.length) return true;
      for (let k = 0; k < slots.length; k++) {
        if (used[k] || !E.fitsSlot(melds[i], slots[k])) continue;
        used[k] = true;
        if (bt(i + 1)) return true;
        used[k] = false;
      }
      return false;
    };
    return bt(0);
  }

      let ws;
      try { ws = new WebSocket(`${proto}//${location.host}/ws`); } catch (e) { toast('Keine Verbindung zum Server möglich.'); return; }
      this.ws = ws;
      ws.onopen = () => {
        this.retry = 0;
        const sess = store.get('session', null);
        if (this.joined && sess) ws.send(JSON.stringify({ t: 'join', code: sess.code, token: sess.token, name: ui.name }));
        else ws.send(JSON.stringify(this.intent));
        clearInterval(this.pinger);
        this.pinger = setInterval(() => { try { ws.send('{"t":"ping"}'); } catch (e) {} }, 20000);
      };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'welcome') { this.joined = true; this.seat = m.seat; store.set('session', { code: m.code, token: m.token }); }
        else if (m.t === 'room') { ui.room = m.room; if (!m.room.started) { if (ui.modalKind === 'roundEnd') closeModal(); ui.view = null; go('lobby'); } }
        else if (m.t === 'state') { onView(m.view); }
        else if (m.t === 'error') { toast(m.msg, 3500); if (!this.joined && /nicht gefunden|läuft bereits|voll/.test(m.msg)) { store.del('session'); this.leave(); go('home'); } }
        else if (m.t === 'kicked') { toast('Du wurdest aus dem Raum entfernt.'); store.del('session'); this.leave(); go('home'); }
        else if (m.t === 'left') { /* ok */ }
      };
      ws.onclose = () => {
        clearInterval(this.pinger);
        if (this.closedByUser) return;
        this.retry++;
        if (this.retry === 2) toast('Verbindung unterbrochen – verbinde neu…');
        setTimeout(() => this.connect(), Math.min(8000, 500 * this.retry));
      };
    }
    send(o) { try { this.ws.send(JSON.stringify(o)); } catch (e) { toast('Nicht verbunden.'); } }
    act(a) { this.send({ t: 'act', a }); }
    again() { this.send({ t: 'again' }); }
    leave() {
      this.closedByUser = true;
      try { this.ws.send(JSON.stringify({ t: 'leave' })); } catch (e) {}
      try { this.ws.close(); } catch (e) {}
      clearInterval(this.pinger);
    }
  }

  // ---------- Navigation ----------
  function go(screen) { ui.screen = screen; render(); }

  function onView(v) {
    const prev = ui.view;
    ui.view = v;
    if (ui.screen !== 'game') ui.screen = 'game';
    // Auswahl bereinigen
    const ids = new Set(v.hand.map((c) => c.id));
    // zuletzt bekommene Karte(n) merken (gezogen, von der Ablage oder beim Klopfen)
    if (!prev || prev.round !== v.round) ui.newIds = [];
    else {
      const old = new Set(prev.hand.map((c) => c.id));
      const added = v.hand.filter((c) => !old.has(c.id)).map((c) => c.id);
      if (added.length) ui.newIds = added;
      else if (v.current === v.seat && v.phase === 'draw' && prev.phase !== 'draw') ui.newIds = [];
    }
    ui.newIds = (ui.newIds || []).filter((id) => ids.has(id));
    ui.selected = ui.selected.filter((id) => ids.has(id));
    const key = `${v.round}|${v.current}|${v.phase === 'play' ? 'p' : 'x'}`;
    if (ui.pilesRound !== v.round) { ui.piles = []; ui.pilesRound = v.round; }
    ui.piles = ui.piles.map((p) => p.filter((id) => ids.has(id))).filter((p) => p.length);
    // Mein Zug?
    const turnKey = `${v.round}|${v.current}|${v.seq}`;
    if (v.current === v.seat && v.phase === 'draw' && (!prev || prev.current !== v.seat || prev.phase !== 'draw')) { vibrate(60); }
    // Klopf-Zeitfenster
    if (v.phase === 'knock') {
      if (!prev || prev.phase !== 'knock') ui.knockStart = Date.now();
      const k = `${v.round}|${v.current}|${v.discardTop && v.discardTop.id}`;
      if (v.knock.pending.includes(v.seat) && !ui.knockPrompt && ui.autoPassed !== k) { ui.autoPassed = k; ui.ctl.act({ type: 'pass' }); }
    }
    ui.lastTurnKey = turnKey;
    render();
    // Rundenende
    if ((v.phase === 'roundEnd' || v.phase === 'gameEnd') && (!prev || prev.phase !== v.phase || prev.round !== v.round)) showRoundEnd();
    if (v.phase !== 'roundEnd' && v.phase !== 'gameEnd' && ui.modalKind === 'roundEnd') closeModal();
  }

    if (ui.dragging) { ui.pendingRender = true; return; }
    if (ui.screen === 'home') return renderHome();
    if (ui.screen === 'lobby') return renderLobby();
    if (ui.screen === 'game' && ui.view) return renderGame();
  }
